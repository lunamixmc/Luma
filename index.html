<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#080b10" />
<title>Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

<!--
  ════════════════════════════════════════════════════════════════════════
   A complete chat app in one file: username/password accounts, direct
   messages, group chats and live updates, backed by Supabase.

   To run it: open this file in a browser, or serve the folder
   (see README.md). No build step, no dependencies to install.
  ════════════════════════════════════════════════════════════════════════
-->

<style>
  /* ══════════════════════════════════════════════════════════════════
     DESIGN TOKENS — retheme here
     ══════════════════════════════════════════════════════════════════ */
  :root {
    /* Backgrounds */
    --bg-dark: #080b10;
    --bg-panel: rgba(255, 255, 255, 0.04);
    --bg-panel-hover: rgba(255, 255, 255, 0.07);
    --bg-input: rgba(0, 0, 0, 0.4);

    /* Borders */
    --border-glass: rgba(255, 255, 255, 0.10);
    --border-glass-hover: rgba(255, 255, 255, 0.20);
    --border-subtle: rgba(255, 255, 255, 0.06);

    /* Accents */
    --accent-purple: #a78bfa;
    --accent-cyan: #67e8f9;
    --accent-green: #86efac;
    --accent-purple-dim: rgba(167, 139, 250, 0.15);
    --accent-cyan-dim: rgba(103, 232, 249, 0.15);
    --accent-green-dim: rgba(134, 239, 172, 0.15);
    --accent-purple-glow: rgba(167, 139, 250, 0.4);
    --accent-cyan-glow: rgba(103, 232, 249, 0.4);
    --accent-green-glow: rgba(134, 239, 172, 0.4);

    /* Text */
    --text-primary: #f0f0f5;
    --text-secondary: rgba(240, 240, 245, 0.62);
    --text-tertiary: rgba(240, 240, 245, 0.34);

    /* Type */
    --font-display: 'Syne', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --font-body: 'Space Mono', monospace;

    /* Shape & motion */
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 22px;
    --radius-full: 9999px;
    --blur: 20px;
    --shadow-glass: 0 8px 32px rgba(0, 0, 0, 0.3);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --speed: 300ms;

    /* Internal aliases kept so the app's markup reads the same */
    --bg: var(--bg-dark);
    --panel: var(--bg-panel);
    --panel-2: var(--bg-input);
    --bubble: rgba(255, 255, 255, 0.05);
    --border: var(--border-glass);
    --text: var(--text-primary);
    --muted: var(--text-secondary);
    --accent: var(--accent-purple);
    --accent-soft: var(--accent-purple-dim);
    --danger: #ff8a8a;

    color-scheme: dark;
  }

  /* ══════════════════════════════════════════════════════════════════
     BASE
     ══════════════════════════════════════════════════════════════════ */
  *, *::before, *::after { box-sizing: border-box; }

  html, body, #root { height: 100%; margin: 0; }

  body {
    background: var(--bg-dark);
    color: var(--text-primary);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  body.has-cursor,
  body.has-cursor button,
  body.has-cursor a { cursor: none; }
  body.has-cursor input,
  body.has-cursor textarea { cursor: text; }

  ::selection { background: var(--accent-purple); color: var(--bg-dark); }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--accent-purple-dim);
    border-radius: var(--radius-full);
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent-purple); }
  * { scrollbar-width: thin; scrollbar-color: var(--accent-purple-dim) transparent; }

  button, input, textarea { font: inherit; color: inherit; }
  button { border: none; background: none; }
  h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.03em; }
  :focus-visible { outline: 2px solid var(--accent-purple); outline-offset: 2px; }

  .muted { color: var(--text-secondary); font-size: 0.76rem; font-family: var(--font-mono); }
  .accent-purple { color: var(--accent-purple); }
  .accent-cyan { color: var(--accent-cyan); }
  .accent-green { color: var(--accent-green); }

  /* ══════════════════════════════════════════════════════════════════
     BACKGROUND EFFECTS
     ══════════════════════════════════════════════════════════════════ */
  .bg-orbs {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.32;
    will-change: transform;
  }
  .orb-1 { width: 520px; height: 520px; background: var(--accent-purple); top: -14%; left: -8%; animation: drift1 26s ease-in-out infinite; }
  .orb-2 { width: 420px; height: 420px; background: var(--accent-cyan); top: 38%; right: -12%; animation: drift2 32s ease-in-out infinite; }
  .orb-3 { width: 380px; height: 380px; background: var(--accent-green); bottom: -12%; left: 26%; animation: drift3 22s ease-in-out infinite; }
  @keyframes drift1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(80px, 60px) scale(1.1); }
    50% { transform: translate(-40px, 120px) scale(0.9); }
    75% { transform: translate(60px, -30px) scale(1.05); }
  }
  @keyframes drift2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(-100px, -80px) scale(1.15); }
    66% { transform: translate(50px, 60px) scale(0.85); }
  }
  @keyframes drift3 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(70px, -90px) scale(1.1); }
  }

  .noise-overlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0.03;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 256px 256px;
  }

  .cursor-dot {
    position: fixed;
    top: 0;
    left: 0;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent-purple);
    pointer-events: none;
    z-index: 1000;
    mix-blend-mode: screen;
    box-shadow: 0 0 20px var(--accent-purple-glow), 0 0 60px var(--accent-purple-dim);
    transition: width 0.2s, height 0.2s, background 0.3s;
    will-change: transform;
  }
  .cursor-dot.hover {
    width: 44px;
    height: 44px;
    background: rgba(167, 139, 250, 0.16);
    border: 1px solid var(--accent-purple);
  }
  @media (hover: none) { .cursor-dot { display: none; } }

  /* ══════════════════════════════════════════════════════════════════
     PRIMITIVES
     ══════════════════════════════════════════════════════════════════ */
  .glass {
    background: var(--bg-panel);
    backdrop-filter: blur(var(--blur));
    -webkit-backdrop-filter: blur(var(--blur));
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-glass);
    position: relative;
    overflow: hidden;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 var(--accent-green-glow); }
    50% { opacity: 0.4; box-shadow: 0 0 12px 4px var(--accent-green-glow); }
  }

  /* ── buttons ─────────────────────────────────────────────────── */
  .primary-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--accent-purple);
    border: none;
    border-radius: var(--radius-full);
    color: var(--bg-dark);
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    padding: 0.7rem 1.35rem;
    cursor: pointer;
    box-shadow: 0 0 24px var(--accent-purple-dim);
    transition: transform var(--speed) var(--ease), box-shadow var(--speed) var(--ease), opacity var(--speed) var(--ease);
  }
  .primary-button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 0 40px var(--accent-purple-glow), 0 8px 32px rgba(0, 0, 0, 0.4);
  }
  .primary-button:active:not(:disabled) { transform: translateY(0); }
  .primary-button:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
  .primary-button.small { padding: 0.6rem 0.9rem; font-size: 0.76rem; width: 100%; }

  .ghost-button {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--bg-panel);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-full);
    color: var(--text-secondary);
    cursor: pointer;
    padding: 0.4rem 0.85rem;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    white-space: nowrap;
    transition: color var(--speed) var(--ease), border-color var(--speed) var(--ease), background var(--speed) var(--ease), transform var(--speed) var(--ease);
  }
  .ghost-button:hover {
    color: var(--text-primary);
    background: var(--bg-panel-hover);
    border-color: var(--border-glass-hover);
    transform: translateY(-1px);
  }

  .plus { margin-right: 0.3rem; }

  /* ══════════════════════════════════════════════════════════════════
     CENTRED SCREENS — auth / setup / boot
     ══════════════════════════════════════════════════════════════════ */
  .auth {
    position: relative;
    z-index: 2;
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    overflow-y: auto;
  }
  .auth::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.05;
    background-image: radial-gradient(circle, var(--text-primary) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse at center, #000 10%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 10%, transparent 70%);
  }

  .auth-card {
    position: relative;
    width: min(430px, 100%);
    background: rgba(10, 14, 20, 0.62);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border-glass);
    border-radius: 26px;
    padding: 2rem 1.85rem 1.6rem;
    box-shadow: var(--shadow-glass), 0 0 80px rgba(167, 139, 250, 0.07), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }
  .auth-card::after {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(140deg, rgba(167, 139, 250, 0.45), transparent 40%, transparent 65%, rgba(103, 232, 249, 0.28));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .brand { display: flex; gap: 0.9rem; align-items: center; margin-bottom: 1.35rem; }
  .brand-mark {
    flex: none;
    width: 50px;
    height: 50px;
    display: grid;
    place-items: center;
    font-size: 1.4rem;
    border-radius: 16px;
    background: var(--accent-purple-dim);
    border: 1px solid var(--accent-purple-dim);
    box-shadow: 0 0 30px rgba(167, 139, 250, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }
  .brand h1 {
    font-size: 1.6rem;
    margin: 0 0 0.3rem;
    line-height: 1;
    letter-spacing: -0.05em;
  }
  .brand p {
    margin: 0;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--text-secondary);
    letter-spacing: 0.01em;
  }

  .tabs {
    display: flex;
    gap: 4px;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid var(--border-subtle);
    padding: 4px;
    border-radius: var(--radius-full);
    margin-bottom: 1.2rem;
  }
  .tab {
    flex: 1;
    background: transparent;
    border: none;
    border-radius: var(--radius-full);
    padding: 0.5rem 0.5rem;
    color: var(--text-secondary);
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.03em;
    transition: color var(--speed) var(--ease), background var(--speed) var(--ease), box-shadow var(--speed) var(--ease);
  }
  .tab:hover { color: var(--text-primary); }
  .tab.active {
    background: var(--accent-purple-dim);
    color: var(--accent-purple);
    box-shadow: inset 0 0 0 1px rgba(167, 139, 250, 0.25), 0 0 20px rgba(167, 139, 250, 0.1);
  }

  .auth-form { display: flex; flex-direction: column; gap: 0.85rem; }
  .auth-form label, .modal-field {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-tertiary);
  }
  .auth-form input, .modal-field input, .modal-scroll input {
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    padding: 0.72rem 0.85rem;
    font-family: var(--font-body);
    font-size: 0.88rem;
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .auth-form input::placeholder, .modal-field input::placeholder,
  .modal-scroll input::placeholder,
  .composer textarea::placeholder { color: var(--text-tertiary); }
  .auth-form input:focus, .modal-field input:focus, .modal-scroll input:focus,
  .composer textarea:focus {
    border-color: rgba(167, 139, 250, 0.55);
    background: rgba(0, 0, 0, 0.55);
    box-shadow: 0 0 0 3px var(--accent-purple-dim);
  }

  .error {
    color: var(--danger);
    font-family: var(--font-mono);
    font-size: 0.74rem;
    margin: 0;
    line-height: 1.5;
    padding: 0.5rem 0.7rem;
    border-radius: var(--radius-sm);
    background: rgba(255, 138, 138, 0.08);
    border: 1px solid rgba(255, 138, 138, 0.22);
  }
  .error:empty { display: none; }

  .hint {
    display: block;
    width: fit-content;
    margin: 1.15rem auto 0;
    color: var(--text-tertiary);
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    text-align: center;
    padding: 6px 16px;
    border: 1px dashed var(--border-glass);
    border-radius: var(--radius-md);
    line-height: 1.6;
  }

  .setup-steps {
    margin: 0;
    padding-left: 1.1rem;
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 0.74rem;
    line-height: 1.8;
  }
  .setup-steps li::marker { color: var(--accent-purple); }
  .setup-steps code, .hint code, .note code {
    background: var(--accent-purple-dim);
    border-radius: 5px;
    padding: 0.1rem 0.35rem;
    font-family: var(--font-mono);
    font-size: 0.92em;
    color: var(--accent-purple);
  }
  .note {
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 0.7rem;
    line-height: 1.7;
    margin: 0 0 1rem;
    padding: 0.7rem 0.8rem;
    border-radius: var(--radius-sm);
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid var(--border-subtle);
  }

  .boot {
    position: relative;
    z-index: 2;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .boot::before {
    content: '';
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid var(--accent-purple-dim);
    border-top-color: var(--accent-purple);
    animation: spin 0.9s linear infinite;
    box-shadow: 0 0 30px var(--accent-purple-dim);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ══════════════════════════════════════════════════════════════════
     APP SHELL — floating glass panels
     ══════════════════════════════════════════════════════════════════ */
  .app-shell {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: 326px 1fr;
    gap: 14px;
    height: 100%;
    padding: 14px;
  }

  /* ══════════════════════════════════════════════════════════════════
     SIDEBAR
     ══════════════════════════════════════════════════════════════════ */
  .sidebar {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: rgba(10, 14, 20, 0.58);
    backdrop-filter: blur(var(--blur));
    -webkit-backdrop-filter: blur(var(--blur));
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-glass), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    overflow: hidden;
  }

  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.4rem;
    padding: 0.95rem 0.75rem 0.9rem 0.95rem;
    border-bottom: 1px solid var(--border-subtle);
    position: relative;
  }
  .sidebar-header::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: -1px;
    height: 1px;
    width: 40%;
    background: linear-gradient(90deg, transparent, var(--accent-purple), transparent);
    opacity: 0.55;
  }

  .me { display: flex; align-items: center; gap: 0.7rem; min-width: 0; }
  .me-text { display: flex; flex-direction: column; min-width: 0; gap: 2px; }
  .me-text strong {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: -0.02em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .me-text .muted {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.64rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-tertiary);
  }
  .me-text .muted::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-green);
    box-shadow: 0 0 10px var(--accent-green-glow);
    animation: blink 2s ease-in-out infinite;
  }

  .avatar {
    flex: none;
    width: 38px;
    height: 38px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border-glass);
    color: var(--text-secondary);
    text-transform: uppercase;
  }
  .avatar-me {
    background: linear-gradient(145deg, var(--accent-purple), #7c5cf0);
    color: var(--bg-dark);
    border-color: rgba(167, 139, 250, 0.5);
    box-shadow: 0 0 22px rgba(167, 139, 250, 0.3);
  }
  .avatar-group {
    background: var(--accent-cyan-dim);
    color: var(--accent-cyan);
    border-color: rgba(103, 232, 249, 0.28);
  }
  .avatar-small { width: 28px; height: 28px; font-size: 0.6rem; border-radius: 9px; }
  .avatar.large {
    width: 58px;
    height: 58px;
    font-size: 1rem;
    border-radius: 18px;
  }

  .sidebar-actions { padding: 0.85rem 0.85rem 0.7rem; }

  .conversation-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 0 0.6rem 0.9rem;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .empty-sidebar { padding: 1.6rem 1rem; text-align: center; }
  .empty-sidebar p { margin: 0.2rem 0; }

  .conversation {
    width: 100%;
    display: flex;
    gap: 0.7rem;
    align-items: center;
    padding: 0.55rem 0.6rem;
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--radius-md);
    cursor: pointer;
    text-align: left;
    transition: background var(--speed) var(--ease), border-color var(--speed) var(--ease), transform var(--speed) var(--ease);
  }
  .conversation:hover {
    background: var(--bg-panel-hover);
    border-color: var(--border-subtle);
    transform: translateX(2px);
  }
  .conversation.active {
    background: linear-gradient(100deg, var(--accent-purple-dim), rgba(167, 139, 250, 0.02));
    border-color: rgba(167, 139, 250, 0.3);
    box-shadow: inset 2px 0 0 var(--accent-purple);
  }
  .conversation-text { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px; }
  .conversation-top { display: flex; justify-content: space-between; gap: 0.5rem; align-items: baseline; }
  .conversation-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.86rem;
    letter-spacing: -0.01em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .conversation-time {
    font-family: var(--font-mono);
    font-size: 0.6rem;
    color: var(--text-tertiary);
    flex: none;
    letter-spacing: 0.02em;
  }
  .conversation-preview {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    color: var(--text-secondary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    opacity: 0.85;
  }

  /* ══════════════════════════════════════════════════════════════════
     CHAT PANE
     ══════════════════════════════════════════════════════════════════ */
  .chat-pane {
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
    background:
      radial-gradient(720px 380px at 88% -8%, rgba(167, 139, 250, 0.12), transparent 62%),
      radial-gradient(620px 380px at 4% 104%, rgba(103, 232, 249, 0.09), transparent 60%),
      rgba(10, 14, 20, 0.56);
    backdrop-filter: blur(var(--blur));
    -webkit-backdrop-filter: blur(var(--blur));
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-glass), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    overflow: hidden;
  }

  .chat-header {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.85rem 1.25rem;
    border-bottom: 1px solid var(--border-subtle);
    background: rgba(255, 255, 255, 0.015);
    position: relative;
  }
  .chat-header::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: -1px;
    height: 1px;
    width: 45%;
    background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
    opacity: 0.4;
  }
  .chat-header-text { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
  .chat-header-text strong {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: -0.02em;
  }
  .chat-header-text .muted {
    font-size: 0.64rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-tertiary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .back-button { display: none; }

  .messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 1.4rem clamp(1rem, 4vw, 2.4rem) 1rem;
    display: flex;
    flex-direction: column;
    gap: 2px;
    scroll-behavior: smooth;
  }

  .day-divider {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    font-family: var(--font-mono);
    font-size: 0.62rem;
    color: var(--text-tertiary);
    margin: 1.3rem 0 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
  }
  .day-divider::before,
  .day-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border-glass), transparent);
  }

  .message-row {
    display: flex;
    gap: 0.55rem;
    align-items: flex-end;
    max-width: min(660px, 84%);
    animation: msg-in 320ms var(--ease) both;
  }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }
  .message-row.run-start { margin-top: 0.6rem; }
  .message-row.mine { margin-left: auto; justify-content: flex-end; }
  .message-body { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
  .message-author {
    font-family: var(--font-mono);
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent-cyan);
    padding-left: 0.2rem;
    opacity: 0.85;
  }
  .bubble {
    background: rgba(255, 255, 255, 0.045);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border-glass);
    border-radius: 18px 18px 18px 6px;
    padding: 0.55rem 0.85rem;
    font-family: var(--font-body);
    font-size: 0.85rem;
    line-height: 1.55;
    color: rgba(240, 240, 245, 0.92);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.22);
  }
  .bubble-mine {
    background: linear-gradient(140deg, #b3a0ff, #977ef7);
    border-color: rgba(167, 139, 250, 0.55);
    border-radius: 18px 18px 6px 18px;
    color: #0b0e14;
    font-weight: 700;
    box-shadow: 0 6px 28px rgba(167, 139, 250, 0.22);
  }

  .empty-chat {
    margin: auto;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.45rem;
    padding: 2rem;
    max-width: 420px;
  }
  .empty-chat h2 {
    margin: 0.7rem 0 0;
    font-size: 1.5rem;
    letter-spacing: -0.04em;
  }
  .empty-chat p {
    margin: 0;
    max-width: 34ch;
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 0.74rem;
    line-height: 1.8;
  }

  .placeholder {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  /* The empty state nests a second .chat-pane inside the first; strip its
     panel chrome so it doesn't draw a card within a card. */
  .placeholder .placeholder {
    background: none;
    border: 0;
    box-shadow: none;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    max-width: 420px;
  }
  .placeholder h2 {
    margin: 0.8rem 0 0.5rem;
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    letter-spacing: -0.05em;
    line-height: 1;
  }
  .placeholder p {
    margin: 0;
    max-width: 36ch;
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 0.76rem;
    line-height: 1.8;
  }
  .placeholder .primary-button { margin-top: 1.4rem; }

  /* ══════════════════════════════════════════════════════════════════
     COMPOSER
     ══════════════════════════════════════════════════════════════════ */
  .composer {
    padding: 0.85rem clamp(1rem, 4vw, 2.4rem) 1rem;
    border-top: 1px solid var(--border-subtle);
    background: rgba(0, 0, 0, 0.18);
  }
  .composer-row { display: flex; gap: 0.6rem; align-items: flex-end; }
  .composer textarea {
    flex: 1;
    resize: none;
    min-height: 46px;
    max-height: 160px;
    padding: 0.72rem 0.95rem;
    background: rgba(0, 0, 0, 0.42);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    outline: none;
    font-family: var(--font-body);
    font-size: 0.85rem;
    line-height: 1.45;
    color: var(--text-primary);
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .send-button { height: 46px; padding: 0 1.4rem; }
  .composer-hint {
    display: block;
    margin-top: 0.5rem;
    font-family: var(--font-mono);
    font-size: 0.62rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-tertiary);
  }

  /* ══════════════════════════════════════════════════════════════════
     MODAL
     ══════════════════════════════════════════════════════════════════ */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(4, 7, 11, 0.72);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: grid;
    place-items: center;
    padding: 1rem;
    z-index: 30;
    animation: fade-in 200ms var(--ease) both;
  }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    width: min(480px, 100%);
    max-height: min(640px, 90vh);
    display: flex;
    flex-direction: column;
    background: rgba(11, 15, 21, 0.82);
    backdrop-filter: blur(26px);
    -webkit-backdrop-filter: blur(26px);
    border: 1px solid var(--border-glass);
    border-radius: 24px;
    padding: 1.35rem;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 70px rgba(167, 139, 250, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    animation: modal-in 260ms var(--ease) both;
  }
  @keyframes modal-in {
    from { opacity: 0; transform: translateY(14px) scale(0.985); }
    to { opacity: 1; transform: none; }
  }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; gap: 0.5rem; }
  .modal-header h2 { font-size: 1.2rem; margin: 0; letter-spacing: -0.04em; }
  .modal .tabs { margin-bottom: 0.9rem; }
  .modal-field { margin-bottom: 0.8rem; }
  .people-list {
    overflow-y: auto;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .people-list .pad {
    padding: 0.75rem 0.5rem;
    line-height: 1.7;
    font-family: var(--font-mono);
    font-size: 0.74rem;
  }
  .person {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    width: 100%;
    padding: 0.5rem 0.6rem;
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--radius-md);
    cursor: pointer;
    text-align: left;
    font-family: var(--font-body);
    font-size: 0.82rem;
    transition: background var(--speed) var(--ease), border-color var(--speed) var(--ease);
  }
  .person:hover { background: var(--bg-panel-hover); }
  .person.selected {
    background: var(--accent-purple-dim);
    border-color: rgba(167, 139, 250, 0.35);
  }
  .person input[type='checkbox'] { accent-color: var(--accent-purple); width: 15px; height: 15px; }
  .person-action {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent-cyan);
    border: 1px solid var(--accent-cyan-dim);
    border-radius: var(--radius-full);
    padding: 2px 10px;
  }
  .modal-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin-top: 1rem;
    padding-top: 0.95rem;
    border-top: 1px solid var(--border-subtle);
  }

  /* ══════════════════════════════════════════════════════════════════
     MESSAGE ACTIONS (edit / delete) + edited flag
     ══════════════════════════════════════════════════════════════════ */
  .chat-header-actions { margin-left: auto; display: flex; gap: 0.4rem; align-items: center; }
  .chat-header-text { flex: 1; }

  .message-body .bubble + .bubble, .message-body .bubble-footer { margin-top: 0.15rem; }
  .bubble-footer {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    min-height: 18px;
    padding-left: 0.2rem;
  }
  .message-row.mine .bubble-footer { justify-content: flex-end; padding: 0 0.2rem 0 0; }

  .edited-flag {
    font-family: var(--font-mono);
    font-size: 0.56rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    white-space: nowrap;
  }

  .message-actions {
    display: flex;
    gap: 0.25rem;
    opacity: 0;
    transition: opacity var(--speed) var(--ease);
  }
  .message-row:hover .message-actions,
  .message-row:focus-within .message-actions { opacity: 1; }
  .action-button {
    border: 1px solid transparent;
    border-radius: var(--radius-full);
    padding: 1px 7px;
    font-family: var(--font-mono);
    font-size: 0.56rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    cursor: pointer;
    transition: color var(--speed) var(--ease), border-color var(--speed) var(--ease), background var(--speed) var(--ease);
  }
  .action-button:hover { color: var(--text-primary); border-color: var(--border-glass); background: var(--bg-panel-hover); }
  .action-button.danger:hover { color: var(--danger); border-color: rgba(255, 138, 138, 0.4); background: rgba(255, 138, 138, 0.1); }
  @media (hover: none) { .message-actions { opacity: 1; } }

  .edit-box { display: flex; flex-direction: column; gap: 0.4rem; min-width: min(340px, 60vw); }
  .edit-input {
    width: 100%;
    resize: none;
    min-height: 46px;
    padding: 0.55rem 0.8rem;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(167, 139, 250, 0.45);
    border-radius: var(--radius-md);
    outline: none;
    font-family: var(--font-body);
    font-size: 0.85rem;
    line-height: 1.5;
    color: var(--text-primary);
    box-shadow: 0 0 0 3px var(--accent-purple-dim);
  }
  .edit-actions { display: flex; gap: 0.4rem; justify-content: flex-end; }
  .mini-button {
    font-family: var(--font-mono);
    font-size: 0.6rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.3rem 0.75rem;
    border-radius: var(--radius-full);
    cursor: pointer;
    border: 1px solid var(--border-glass);
    background: var(--bg-panel);
    color: var(--text-secondary);
    transition: all var(--speed) var(--ease);
  }
  .mini-button:hover { color: var(--text-primary); border-color: var(--border-glass-hover); background: var(--bg-panel-hover); }
  .mini-button.accent { background: var(--accent-purple); border-color: transparent; color: var(--bg-dark); font-weight: 700; }
  .mini-button.accent:hover { transform: translateY(-1px); box-shadow: 0 0 22px var(--accent-purple-glow); }
  .mini-button.danger { border-color: rgba(255, 138, 138, 0.35); color: var(--danger); }
  .mini-button.danger:hover { background: rgba(255, 138, 138, 0.12); border-color: rgba(255, 138, 138, 0.55); }
  .mini-button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

  /* ══════════════════════════════════════════════════════════════════
     GROUP DETAILS MODAL
     ══════════════════════════════════════════════════════════════════ */
  .modal-scroll {
    overflow-y: auto;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    margin-right: -0.35rem;
    padding-right: 0.35rem;
  }
  .group-name-row { display: flex; gap: 0.45rem; align-items: center; }
  .group-name-row input {
    flex: 1;
    padding: 0.6rem 0.8rem;
    background: rgba(0, 0, 0, 0.42);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    outline: none;
    font-size: 0.85rem;
    color: var(--text-primary);
    transition: border-color var(--speed) var(--ease), box-shadow var(--speed) var(--ease);
  }
  .group-name-row input:focus { border-color: rgba(167, 139, 250, 0.5); box-shadow: 0 0 0 3px var(--accent-purple-dim); }
  .group-name-row input:disabled { opacity: 0.55; cursor: not-allowed; }
  .roster-actions .mini-button { padding: 0.22rem 0.6rem; font-size: 0.56rem; }

  .subsection-label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin: 1rem 0 0.45rem;
    font-family: var(--font-mono);
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent-cyan);
  }
  .subsection-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--border-glass), transparent);
  }

  .roster { display: flex; flex-direction: column; gap: 2px; }
  .roster-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.42rem 0.55rem;
    border-radius: var(--radius-md);
    border: 1px solid transparent;
    font-size: 0.82rem;
  }
  .roster-row:hover { background: var(--bg-panel-hover); border-color: var(--border-subtle); }
  .roster-name { display: flex; align-items: baseline; gap: 0.45rem; min-width: 0; }
  .roster-name em { font-style: normal; color: var(--text-tertiary); font-size: 0.7rem; }
  .roster-badge {
    font-family: var(--font-mono);
    font-size: 0.55rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent-green);
    border: 1px solid var(--accent-green-dim);
    border-radius: var(--radius-full);
    padding: 1px 7px;
    white-space: nowrap;
  }
  .roster-actions { margin-left: auto; display: flex; gap: 0.3rem; }
  .group-hint {
    font-family: var(--font-mono);
    font-size: 0.66rem;
    line-height: 1.7;
    color: var(--text-tertiary);
    margin: 0.35rem 0 0;
  }

  /* ══════════════════════════════════════════════════════════════════
     TOAST
     ══════════════════════════════════════════════════════════════════ */
  .toast {
    position: fixed;
    bottom: 1.35rem;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(38, 18, 26, 0.85);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 138, 138, 0.35);
    color: #ffd9d9;
    border-radius: var(--radius-full);
    padding: 0.6rem 1.1rem;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    max-width: min(480px, 90vw);
    cursor: pointer;
    z-index: 40;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    animation: fade-in 200ms var(--ease) both;
  }

  /* ══════════════════════════════════════════════════════════════════
     NARROW SCREENS
     ══════════════════════════════════════════════════════════════════ */
  @media (max-width: 800px) {
    .app-shell { grid-template-columns: 1fr; padding: 10px; gap: 0; }
    .app-shell:not(.chat-open) .chat-pane { display: none; }
    .app-shell.chat-open .sidebar { display: none; }
    .sidebar, .chat-pane { border-radius: 20px; }
    .back-button { display: inline-flex; }
    .message-row { max-width: 90%; }
    .auth-card { padding: 1.6rem 1.35rem 1.35rem; border-radius: 22px; }
    .brand h1 { font-size: 1.4rem; }
    .composer-hint { display: none; }
  }
  @media (max-width: 480px) {
    .app-shell { padding: 8px; }
    .avatar.large { width: 50px; height: 50px; border-radius: 15px; }
    .placeholder h2 { font-size: 1.6rem; }
  }

  /* ══════════════════════════════════════════════════════════════════
     FILE ATTACHMENTS
     ══════════════════════════════════════════════════════════════════ */
  .hidden-file { display: none; }

  .attach-button {
    flex: none;
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    font-size: 1.05rem;
    background: rgba(0, 0, 0, 0.42);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: border-color var(--speed) var(--ease), background var(--speed) var(--ease), transform var(--speed) var(--ease);
  }
  .attach-button:hover:not(:disabled) {
    border-color: var(--accent-cyan-dim);
    background: var(--accent-cyan-dim);
    transform: translateY(-1px);
  }
  .attach-button:disabled { opacity: 0.4; cursor: not-allowed; }

  .upload-bar {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.55rem;
    font-family: var(--font-mono);
    font-size: 0.66rem;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
  }
  .upload-track {
    flex: 1;
    height: 4px;
    border-radius: var(--radius-full);
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }
  .upload-fill {
    height: 100%;
    width: 0;
    border-radius: var(--radius-full);
    background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan));
    transition: width 160ms linear;
  }

  .bubble.bubble-media {
    padding: 0.4rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    max-width: min(420px, 100%);
  }
  .bubble-text { padding: 0.1rem 0.5rem 0.25rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bubble-media .bubble-text { font-weight: 400; }

  .attachment-card {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.6rem 0.75rem;
    background: rgba(0, 0, 0, 0.28);
    border: 1px solid var(--border-subtle);
    border-radius: 14px;
    text-decoration: none;
    color: inherit;
    min-width: 0;
    transition: border-color var(--speed) var(--ease), background var(--speed) var(--ease);
  }
  .attachment-card:hover { border-color: var(--border-glass-hover); background: rgba(0, 0, 0, 0.38); }
  .bubble-mine .attachment-card {
    background: rgba(8, 11, 16, 0.22);
    border-color: rgba(8, 11, 16, 0.28);
    color: #0b0e14;
  }
  .bubble-mine .attachment-card:hover { background: rgba(8, 11, 16, 0.32); }
  .attachment-icon {
    flex: none;
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    font-size: 1.05rem;
    border-radius: 11px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border-subtle);
  }
  .bubble-mine .attachment-icon { background: rgba(8, 11, 16, 0.18); border-color: rgba(8, 11, 16, 0.25); }

  <div id="root"></div>

  <!-- Supabase from a CDN: no build step, no npm install. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <script>
  (() => {
    'use strict';

    // ════════════════════════════════════════════════════════════════════
    //  1. CONFIGURATION
    //  Your Supabase project. Values are hardcoded so the app never asks.
    //  The anon key is safe to ship: database rules protect your data.
    // ════════════════════════════════════════════════════════════════════
    const SUPABASE_URL = 'https://kpdnoxmnycrtbklvuluu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtwZG5veG1ueWNydGJrbHZ1bHV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMTY3NjIsImV4cCI6MjEwODc5Mjc2Mn0.6wukT9y083X1Br89EKmB0iKgAWrhpgHcZJDxuGrYYtY';

    // Supabase Auth identifies accounts by email, so a username gets a hidden
    // address behind the scenes (alex@chat.app). No email is ever sent.
    const EMAIL_DOMAIN = 'chat.app';
    const CONFIG_STORAGE_KEY = 'chat.config';

    // ════════════════════════════════════════════════════════════════════
    //  2. SMALL HELPERS
    // ════════════════════════════════════════════════════════════════════
    const $root = document.getElementById('root');

    /** Tiny hyperscript: h('div', { class: 'x', onclick: fn }, 'text', child) */
    function h(tag, props, ...children) {
      const node = document.createElement(tag);
      if (props) {
        for (const [key, value] of Object.entries(props)) {
          if (value === null || value === undefined || value === false) continue;
          if (key === 'class') node.className = value;
          else if (key === 'text') node.textContent = value;
          else if (key === 'value') node.value = value;
          else if (key === 'checked') node.checked = Boolean(value);
          else if (key.startsWith('on')) node.addEventListener(key.slice(2).toLowerCase(), value);
          else node.setAttribute(key, value === true ? '' : value);
        }
      }
      for (const child of children.flat()) {
        if (child === null || child === undefined || child === false) continue;
        node.append(child instanceof Node ? child : document.createTextNode(String(child)));
      }
      return node;
    }

    /** localStorage that degrades to memory (some browsers block it on file://). */
    const storage = (() => {
      try {
        const probe = '__chat_probe__';
        window.localStorage.setItem(probe, '1');
        window.localStorage.removeItem(probe);
        return window.localStorage;
      } catch {
        const memory = new Map();
        return {
          getItem: (key) => (memory.has(key) ? memory.get(key) : null),
          setItem: (key, value) => memory.set(key, value),
          removeItem: (key) => memory.delete(key),
        };
      }
    })();

    function loadConfig() {
      if (SUPABASE_URL && SUPABASE_ANON_KEY) {
        return { url: SUPABASE_URL, anonKey: SUPABASE_ANON_KEY };
      }
      try {
        const saved = JSON.parse(storage.getItem(CONFIG_STORAGE_KEY) || 'null');
        if (saved && saved.url && saved.anonKey) return saved;
      } catch { /* ignore malformed saved config */ }
      return null;
    }

    function saveConfig(url, anonKey) {
      storage.setItem(CONFIG_STORAGE_KEY, JSON.stringify({ url, anonKey }));
    }

    const normalizeUsername = (value) => value.trim().toLowerCase();
    const usernameToEmail = (username) => `${normalizeUsername(username)}@${EMAIL_DOMAIN}`;

    function validateUsername(username) {
      if (username.length < 3) return 'Usernames need at least 3 characters.';
      if (username.length > 20) return 'Usernames can be at most 20 characters.';
      if (!/^[a-z0-9_]+$/.test(username)) return 'Use only lowercase letters, numbers and underscores.';
      return null;
    }

    function validatePassword(password) {
      if (password.length < 6) return 'Passwords need at least 6 characters.';
      if (password.length > 72) return 'Passwords can be at most 72 characters.';
      return null;
    }

    function friendlyError(error, fallback = 'Something went wrong.') {
      // Supabase returns auth failures as Error instances but database failures as
      // plain { message, details, hint, code } objects — read both.
      const raw = error instanceof Error
        ? error.message
        : (error && typeof error === 'object' && typeof error.message === 'string')
          ? error.message
          : String(error || '');
      const message = raw.toLowerCase();
      if (message.includes('already registered') ||
          message.includes('database error saving new user') ||
          message.includes('duplicate key')) {
        return 'That username is already taken.';
      }
      if (message.includes('invalid login credentials')) return 'Wrong username or password.';
      if (message.includes('password should be at least')) return 'Passwords need at least 6 characters.';
      if (message.includes('rate limit') || message.includes('too many')) {
        return 'Too many attempts. Wait a minute, then try again.';
      }
      if (message.includes('failed to fetch') || message.includes('network')) {
        return 'Could not reach Supabase. Check your connection and your project URL / anon key.';
      }
      return raw || fallback;
    }

    // ── formatting ──────────────────────────────────────────────────────
    function conversationTitle(conversation, meId) {
      if (conversation.kind === 'group') return conversation.name || 'Group chat';
      const other = conversation.members.find((member) => member.id !== meId);
      return other ? other.username : 'Direct message';
    }

    function conversationSubtitle(conversation, meId) {
      if (conversation.kind === 'dm') return 'Direct message';
      const names = conversation.members
        .filter((member) => member.id !== meId)
        .map((member) => member.username);
      if (names.length === 0) return 'Just you';
      if (names.length <= 3) return names.join(', ');
      return `${names.slice(0, 3).join(', ')} +${names.length - 3} more`;
    }

    function initialsFor(conversation, meId) {
      if (conversation.kind === 'group') return '#';
      const other = conversation.members.find((member) => member.id !== meId);
      return (other ? other.username : '?').slice(0, 2).toUpperCase();
    }

    function formatTime(iso) {
      if (!iso) return '';
      const date = new Date(iso);
      const now = new Date();
      if (date.toDateString() === now.toDateString()) {
        return date.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
      }
      const yesterday = new Date(now);
      yesterday.setDate(now.getDate() - 1);
      if (date.toDateString() === yesterday.toDateString()) return 'Yesterday';
      return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    function dayLabel(iso) {
      const date = new Date(iso);
      const now = new Date();
      if (date.toDateString() === now.toDateString()) return 'Today';
      const yesterday = new Date(now);
      yesterday.setDate(now.getDate() - 1);
      if (date.toDateString() === yesterday.toDateString()) return 'Yesterday';
      return date.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
    }

    const sameDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();

    // ════════════════════════════════════════════════════════════════════
    //  3. STATE
    // ════════════════════════════════════════════════════════════════════
    const state = {
      sb: null,             // Supabase client
      session: null,
      me: null,             // { id, username, suspended }
      conversations: [],
      activeId: null,
      messages: [],
      channel: null,
      people: [],
      duel: null,           // newest duel in the open chat (if any)
      duelMoves: [],        // its rows: chess moves and flappy scores
      duelDismissed: new Set(),
      admin: { key: null, tab: 'overview' },
    };

    // Persistent nodes, so typing in the composer survives re-renders.
    const ui = {
      shell: null,
      convList: null,
      chatPane: null,
      duelSlot: null,      // the strip above the composer where a duel appears
      dialogRefresh: null, // re-draws the open group dialog when something changes
    };

    const activeConversation = () =>
      state.conversations.find((conversation) => conversation.id === state.activeId) || null;

    const isGroupChat = (conversation) => Boolean(conversation && conversation.kind === 'group');
    const isDmChat = (conversation) => Boolean(conversation && conversation.kind === 'dm');

    const MAX_FILE_BYTES = 25 * 1024 * 1024; // matches the storage bucket limit

    function formatBytes(bytes) {
      const n = Number(bytes) || 0;
      if (n < 1024) return `${n} B`;
      if (n < 1024 * 1024) return `${(n / 1024).toFixed(0)} KB`;
      return `${(n / (1024 * 1024)).toFixed(1)} MB`;
    }

    /**
     * Private storage files are only readable through a short-lived signed URL.
     * Cache them so re-rendering a conversation doesn't sign the same file twice.
     */
    const signedUrlCache = new Map();

    async function signedUrl(path) {
      if (!path) return null;
      const cached = signedUrlCache.get(path);
      if (cached && cached.expires > Date.now()) return cached.url;
      const { data, error } = await state.sb.storage
        .from('chat-files')
        .createSignedUrl(path, 60 * 30);
      if (error || !data) return null;
      signedUrlCache.set(path, { url: data.signedUrl, expires: Date.now() + 25 * 60 * 1000 });
      return data.signedUrl;
    }

    const isImageAttachment = (message) =>
      Boolean(message.attachment_path && /^image\//.test(message.attachment_type || ''));

    function fileIcon(name, type) {
      const kind = (type || '').toLowerCase();
      const ext = String(name || '').split('.').pop().toLowerCase();
      if (kind.startsWith('image/')) return '🖼️';
      if (kind.startsWith('video/')) return '🎬';
      if (kind.startsWith('audio/')) return '🎵';
      if (kind.includes('pdf') || ext === 'pdf') return '📕';
      if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) return '🗜️';
      if (['doc', 'docx', 'txt', 'md', 'rtf'].includes(ext)) return '📄';
      if (['xls', 'xlsx', 'csv'].includes(ext)) return '📊';
      if (['ppt', 'pptx'].includes(ext)) return '📽️';
      if (['js', 'ts', 'html', 'css', 'json', 'py', 'sql'].includes(ext)) return '🧾';
      return '📎';
    }

    /** A filename that is safe for a storage path: no slashes, no oddities. */
    function safeFileName(name) {
      return String(name || 'file')
        .replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_')
        .slice(-80);
    }

    // Only the person who created a group may rename it, add people or kick them.
    const isCreatorOf = (conversation) =>
      Boolean(conversation && state.me && conversation.created_by === state.me.id);

    /** Everyone except me — used by both the "new chat" and "add people" pickers. */
    async function loadPeople(force = false) {
      if (state.people.length > 0 && !force) return state.people;
      const { data, error } = await state.sb
        .from('profiles')
        .select('id, username')
        .neq('id', state.me.id)
        .order('username', { ascending: true })
        .limit(500);
      if (error) throw error;
      state.people = data || [];
      return state.people;
    }

    function scrollMessagesToBottom() {
      const box = document.getElementById('messages');
      if (box) box.scrollTop = box.scrollHeight;
    }

    function toast(message) {
      document.querySelectorAll('.toast').forEach((node) => node.remove());
      const node = h('div', { class: 'toast', text: message, onclick: () => node.remove() });
      document.body.append(node);
      setTimeout(() => node.remove(), 6000);
    }

    // ════════════════════════════════════════════════════════════════════
    //  4. SETUP SCREEN (no Supabase config yet)
    // ════════════════════════════════════════════════════════════════════
    function renderSetup(message) {
      const urlInput = h('input', { placeholder: 'https://your-project.supabase.co', autocomplete: 'off', spellcheck: 'false' });
      const keyInput = h('input', { placeholder: 'eyJhbGciOiJIUzI1NiIs…', autocomplete: 'off', spellcheck: 'false' });
      const errorLine = h('p', { class: 'error', text: message || '' });

      const form = h('form', { class: 'auth-form' },

        h('button', { class: 'primary-button', type: 'submit', text: 'Save and continue' }),
      );

      form.addEventListener('submit', (event) => {
        event.preventDefault();

    // ════════════════════════════════════════════════════════════════════
    //  5. SIGN IN / CREATE ACCOUNT
    // ════════════════════════════════════════════════════════════════════
    let authMode = 'signin';

    function renderAuth(message) {
      const usernameInput = h('input', {
        placeholder: 'e.g. alex',
        autocomplete: 'username',
        autocapitalize: 'none',
        autocorrect: 'off',
        spellcheck: 'false',
        maxlength: '20',
      });
      const passwordInput = h('input', {
        type: 'password',
        placeholder: 'At least 6 characters',
        autocomplete: 'current-password',
      });
      const errorLine = h('p', { class: 'error', text: message || '' });
      const submitButton = h('button', { class: 'primary-button', type: 'submit', text: 'Sign in' });
      const hintLine = h('p', { class: 'hint', text: 'New here? Choose "Create account" above.' });

      const signInTab = h('button', { class: 'tab active', type: 'button', text: 'Sign in' });
      const signUpTab = h('button', { class: 'tab', type: 'button', text: 'Create account' });

      function setMode(mode) {
        authMode = mode;
        signInTab.classList.toggle('active', mode === 'signin');
        signUpTab.classList.toggle('active', mode === 'signup');
        submitButton.textContent = mode === 'signup' ? 'Create account' : 'Sign in';
        passwordInput.placeholder = mode === 'signup' ? 'At least 6 characters' : 'Your password';
        passwordInput.autocomplete = mode === 'signup' ? 'new-password' : 'current-password';
        hintLine.textContent = mode === 'signup'
          ? 'Pick any username — no email address needed.'
          : 'New here? Choose "Create account" above.';
        errorLine.textContent = '';
      }

      signInTab.addEventListener('click', () => setMode('signin'));
      signUpTab.addEventListener('click', () => setMode('signup'));

      const form = h('form', { class: 'auth-form' },
        h('label', null, h('span', { text: 'Username' }), usernameInput),
        h('label', null, h('span', { text: 'Password' }), passwordInput),
        errorLine,
        submitButton,
      );

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorLine.textContent = '';

        const username = normalizeUsername(usernameInput.value);
        const password = passwordInput.value;
        const problem = validateUsername(username) || validatePassword(password);
        if (problem) {
          errorLine.textContent = problem;
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent = 'Just a second…';

        try {
          if (authMode === 'signup') {
            const { data, error } = await state.sb.auth.signUp({
              email: usernameToEmail(username),
              password,
              options: { data: { username } },
            });
            if (error) throw error;
            if (!data.session) {
              if (data.user && data.user.identities && data.user.identities.length === 0) {
                throw new Error('That username is already taken.');
              }
              throw new Error(
                'Account created, but sign-in is blocked. In Supabase, turn off Authentication → ' +
                'Sign In / Providers → Email → "Confirm email", then sign in.',
              );
            }
          } else {
            const { error } = await state.sb.auth.signInWithPassword({
              email: usernameToEmail(username),
              password,
            });
            if (error) throw error;
          }
        } catch (error) {
          errorLine.textContent = friendlyError(error, 'Could not sign you in.');
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = authMode === 'signup' ? 'Create account' : 'Sign in';
        }
      });

      setMode(authMode);

      $root.replaceChildren(
        h('div', { class: 'auth' },
          h('div', { class: 'auth-card' },
            h('div', { class: 'brand' },
              h('div', { class: 'brand-mark', text: '💬' }),
              h('div', null,
                h('h1', { text: 'Chat' }),
                h('p', { class: 'muted', text: 'Messages with friends, groups and DMs.' })),
            ),
            h('div', { class: 'tabs' }, signInTab, signUpTab),
            form,
            hintLine,
          ),
        ),
      );

      usernameInput.focus();
    }

    // ════════════════════════════════════════════════════════════════════
    //  6. DATA
    // ════════════════════════════════════════════════════════════════════
    async function loadProfile() {
      const userId = state.session.user.id;
      // '*' rather than a column list: if the newest schema has not been run
      // yet, asking for `suspended` by name would break sign-in entirely.
      const { data } = await state.sb
        .from('profiles')
        .select('*')
        .eq('id', userId)
        .maybeSingle();

      if (data) return data;

      // Safety net: a database trigger normally creates this row at sign-up.
      const fallbackName =
        (state.session.user.user_metadata && state.session.user.user_metadata.username) ||
        (state.session.user.email || 'user@x').split('@')[0];

      const { data: created } = await state.sb
        .from('profiles')
        .insert({ id: userId, username: fallbackName })
        .select('*')
        .single();

      return created || null;
    }

    async function loadConversations() {
      const { data, error } = await state.sb.rpc('list_conversations');
      if (error) {
        toast(error.message);
        return;
      }
      state.conversations = data || [];
      // Keep a valid selection (or pick the most recent thread).
      if (!activeConversation()) {
        state.activeId = state.conversations.length ? state.conversations[0].id : null;
      }
    }

    async function loadMessages(conversationId) {
      const { data, error } = await state.sb
        .from('messages')
        .select('*')
        .eq('conversation_id', conversationId)
        .order('created_at', { ascending: true })
        .limit(300);
      if (error) {
        toast(error.message);
        return [];
      }
      return data || [];
    }

    // ════════════════════════════════════════════════════════════════════
    //  7. SIDEBAR
    // ════════════════════════════════════════════════════════════════════
    function renderSidebar() {

      if (state.conversations.length === 0) {
        ui.convList.replaceChildren(

              h('div', { class: 'conversation-top' },
                h('span', { class: 'conversation-title', text: title }),
                h('span', { class: 'conversation-time', text: formatTime(conversation.last_message_at) }),

    // ════════════════════════════════════════════════════════════════════
    //  8. CHAT PANE
    // ════════════════════════════════════════════════════════════════════
    function usernameOf(userId) {
      if (state.me && userId === state.me.id) return state.me.username;
      const conversation = activeConversation();
      const member = conversation && conversation.members.find((person) => person.id === userId);
      return member ? member.username : 'unknown';
    }

    function renderMessages(options = {}) {
      const box = document.getElementById('messages');
      if (!box) return;
      const previousScroll = box.scrollTop;
      box.replaceChildren();

      const conversation = activeConversation();
      if (!conversation) return;

      if (state.messages.length === 0) {
        box.append(
          h('div', { class: 'empty-chat' },
            h('div', {
              class: 'avatar large ' + (conversation.kind === 'group' ? 'avatar-group' : ''),
              text: conversation.kind === 'group' ? '#' : conversationTitle(conversation, state.me.id).slice(0, 2).toUpperCase(),
            }),
            h('h2', { text: conversationTitle(conversation, state.me.id) }),
            h('p', {
              class: 'muted',
              text: conversation.kind === 'group'
                ? 'This is the start of the group. Say hello to everyone.'
                : 'No messages yet. Say hi to get started.',
            }),
          ),
        );
        return;
      }

      state.messages.forEach((message, index) => {
        box.append(buildMessageRow(message, index > 0 ? state.messages[index - 1] : null));
      });

      // Edits and deletions redraw in place; new messages jump to the bottom.
      if (options.keepScroll) box.scrollTop = previousScroll;
      else scrollMessagesToBottom();
    }

    /** The picture, or the little file card, that sits inside a bubble. */
    function attachmentNode(message) {
      const path = message.attachment_path;
      const name = message.attachment_name || 'file';

      if (isImageAttachment(message)) {
        const frame = h('div', { class: 'attachment-loading', text: 'loading picture…' });
        const img = h('img', { class: 'attachment-thumb', alt: name });
        const open = () => {
          signedUrl(path).then((url) => {
            if (url) window.open(url, '_blank', 'noopener');
          });
        };
        img.addEventListener('click', open);
        signedUrl(path).then((url) => {
          if (!url) {
            if (frame.isConnected) {
              frame.textContent = 'picture unavailable';
              frame.replaceWith(fileCard(message));
            }
            return;
          }
          img.src = url;
          if (frame.isConnected) frame.replaceWith(img);
        });
        return frame;
      }

      return fileCard(message);
    }

    function fileCard(message) {
      const name = message.attachment_name || 'file';
      const card = h('a', {
        class: 'attachment-card',
        href: '#',
        title: `Download ${name}`,
      },
        h('div', { class: 'attachment-icon', text: fileIcon(name, message.attachment_type) }),
        h('div', { class: 'attachment-meta' },
          h('span', { class: 'attachment-name', text: name }),
          h('span', { class: 'attachment-size', text: formatBytes(message.attachment_size) + ' · download' }),
        ),
      );
      card.addEventListener('click', async (event) => {
        event.preventDefault();
        const url = await signedUrl(message.attachment_path);
        if (!url) {
          toast('That file is no longer available.');
          return;
        }
        const link = h('a', { href: url, download: name });
        document.body.append(link);
        link.click();
        link.remove();
      });
      return card;
    }

    function buildMessageRow(message, previous) {
      const conversation = activeConversation();
      const mine = message.sender_id === state.me.id;
      const group = isGroupChat(conversation);
      const startsRun = !previous || previous.sender_id !== message.sender_id;
      const showAuthor = group && startsRun;
      // The group creator can delete anybody's message, not just their own.
      const canDelete = mine || (group && isCreatorOf(conversation));

      const wrapper = h('div');
      if (!previous || !sameDay(previous.created_at, message.created_at)) {
        wrapper.append(h('div', { class: 'day-divider', text: dayLabel(message.created_at) }));
      }

      const row = h('div', {
        class: 'message-row' + (mine ? ' mine' : '') + (startsRun ? ' run-start' : ''),
        'data-message-id': message.id,
      });

      const body = h('div', { class: 'message-body' });
      if (showAuthor) {
        body.append(h('span', { class: 'message-author', text: '@' + usernameOf(message.sender_id) }));
      }

      const bubble = h('div', {
        class: 'bubble' + (mine ? ' bubble-mine' : '') + (message.attachment_path ? ' bubble-media' : ''),
        title: formatTime(message.created_at),
      });
      if (message.attachment_path) bubble.append(attachmentNode(message));
      if (message.body && message.body.trim()) {
        bubble.append(h('div', { class: 'bubble-text', text: message.body }));
      } else if (!message.attachment_path) {
        bubble.textContent = message.body || '';
      }

      const actions = h('div', { class: 'message-actions' });
      if (mine) {
        actions.append(h('button', {
          class: 'action-button', type: 'button', text: 'Edit',
          onclick: () => startEditing(),
        }));
      }
      if (canDelete) {
        actions.append(h('button', {
          class: 'action-button danger', type: 'button', text: 'Delete',
          onclick: () => removeMessage(),
        }));
      }

      const footerRow = h('div', { class: 'bubble-footer' });
      if (message.edited_at) {
        footerRow.append(h('span', { class: 'edited-flag', text: 'edited ' + formatTime(message.edited_at) }));
      }
      footerRow.append(actions);

      // Only reserve the strip when there is something in it (an "edited" flag or
      // an action button), so ordinary messages keep their tight spacing.
      if (footerRow.childElementCount > 0) body.append(bubble, footerRow);
      else body.append(bubble);
      row.append(body);
      wrapper.append(row);

      // ── edit in place ─────────────────────────────────────────────────
      function startEditing() {
        if (body.querySelector('.edit-box')) return;

        const input = h('textarea', { class: 'edit-input', rows: '1', maxlength: '4000' });
        input.value = message.body;

        const saveButton = h('button', { class: 'mini-button accent', type: 'button', text: 'Save' });
        const cancelButton = h('button', { class: 'mini-button', type: 'button', text: 'Cancel' });
        const box = h('div', { class: 'edit-box' },
          input,
          h('div', { class: 'edit-actions' }, cancelButton, saveButton),
        );

        const autosize = () => {
          input.style.height = 'auto';
          input.style.height = Math.min(input.scrollHeight, 200) + 'px';
        };

        bubble.replaceWith(box);
        autosize();
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);

        function cleanup() {
          document.removeEventListener('keydown', onEscape, true);
        }

        function stopEditing() {
          cleanup();
          if (box.isConnected) box.replaceWith(bubble);
        }

        // Escape cancels from anywhere, not just while the textarea has focus.
        function onEscape(event) {
          if (event.key !== 'Escape') return;
          event.stopPropagation();
          stopEditing();
        }
        document.addEventListener('keydown', onEscape, true);

        cancelButton.addEventListener('click', stopEditing);
        input.addEventListener('input', autosize);
        input.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            saveButton.click();
          }
        });

        saveButton.addEventListener('click', async () => {
          const text = input.value.trim();
          if (!text && !message.attachment_path) {
            toast('A message cannot be empty — delete it instead.');
            return;
          }
          if (text === message.body) {
            stopEditing();
            return;
          }

          const original = message.body;
          saveButton.disabled = true;
          saveButton.textContent = 'Saving…';

          const { data, error } = await state.sb
            .from('messages')
            .update({ body: text })
            .eq('id', message.id)
            .select()
            .single();

          if (error) {
            saveButton.disabled = false;
            saveButton.textContent = 'Save';
            toast(friendlyError(error, 'Could not save that edit.'));
            return;
          }

          const stored = state.messages.find((item) => item.id === message.id);
          if (stored) {
            stored.body = data.body;
            stored.edited_at = data.edited_at;
          }

          // Keep the sidebar preview honest when the edited message is the latest one.
          state.conversations = state.conversations.map((item) =>
            item.id === message.conversation_id && item.last_message === original
              ? { ...item, last_message: data.body }
              : item,
          );
          cleanup();
          renderSidebar();
          renderMessages({ keepScroll: true });
        });
      }

      // ── delete ────────────────────────────────────────────────────────
      async function removeMessage() {
        const question = mine
          ? 'Delete this message for everyone?'
          : `Delete this message from @${usernameOf(message.sender_id)}?`;
        if (!window.confirm(question)) return;

        const { error } = await state.sb.from('messages').delete().eq('id', message.id);
        if (error) {
          toast(friendlyError(error, 'Could not delete that message.'));
          return;
        }

        const index = state.messages.findIndex((item) => item.id === message.id);
        if (index > -1) state.messages.splice(index, 1);
        await loadConversations();
        renderSidebar();
        renderMessages({ keepScroll: true });
      }

      return wrapper;
    }

    function renderChat() {
      const pane = ui.chatPane;
      const conversation = activeConversation();
      pane.replaceChildren();

      if (!conversation) {
        if (ui.shell) ui.shell.classList.remove('chat-open');
        pane.classList.add('placeholder');
        pane.append(
          h('div', { class: 'chat-pane placeholder' },
            h('div', null,
              h('h2', { text: 'Welcome, @' + state.me.username }),
              h('p', { class: 'muted', text: 'Pick a chat on the left, or start a new one.' }),
              h('button', { class: 'primary-button', type: 'button', text: 'New chat', onclick: openNewChatDialog }),
            ),
          ),
        );
        return;
      }

      pane.classList.remove('placeholder');
      if (ui.shell) ui.shell.classList.add('chat-open');

      const textarea = h('textarea', {
        rows: '1',
        maxlength: '4000',
        placeholder: 'Message ' + conversationTitle(conversation, state.me.id),
      });

      const sendButton = h('button', {
        class: 'primary-button send-button',
        type: 'button',
        text: 'Send',
        onclick: () => send(textarea.value),
      });

      const composerError = h('p', { class: 'error', text: '' });

      textarea.addEventListener('input', () => {
        sendButton.disabled = textarea.value.trim().length === 0;
        textarea.style.height = 'auto';
        textarea.style.height = Math.min(textarea.scrollHeight, 160) + 'px';
      });

      textarea.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          send(textarea.value);
        }
      });

      // ── file picker + upload progress ─────────────────────────────────
      const uploadLabel = h('span', { text: '' });
      const uploadFill = h('div', { class: 'upload-fill' });
      const uploadBar = h('div', { class: 'upload-bar', style: 'display:none' },
        uploadLabel,
        h('div', { class: 'upload-track' }, uploadFill),
      );

      const fileInput = h('input', { type: 'file', class: 'hidden-file' });
      fileInput.addEventListener('change', () => {
        const file = fileInput.files && fileInput.files[0];
        fileInput.value = ''; // so picking the same file twice still fires
        if (file) uploadFile(file);
      });

      const attachButton = h('button', {
        class: 'attach-button',
        type: 'button',
        text: '📎',
        title: 'Send a file (up to 25 MB)',
        'aria-label': 'Attach a file',
        onclick: () => fileInput.click(),
      });

      function newId() {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {
          return window.crypto.randomUUID();
        }
        return Math.random().toString(16).slice(2) + Date.now().toString(16);
      }

      async function insert(conversationId, payload) {
        const { data, error } = await state.sb
          .from('messages')
          .insert({ conversation_id: conversationId, sender_id: state.me.id, ...payload })
          .select()
          .single();
        if (error) throw error;
        return data;
      }

      /** Put a saved message on screen and into the sidebar, without a refetch. */
      function afterSend(saved, conversationId) {
        if (conversationId === state.activeId) {
          if (!state.messages.some((message) => message.id === saved.id)) {
            const previous = state.messages[state.messages.length - 1] || null;
            state.messages.push(saved);
            const box = document.getElementById('messages');
            if (box) {
              const emptyState = box.querySelector('.empty-chat');
              if (emptyState) emptyState.remove();
              box.append(buildMessageRow(saved, previous));
              scrollMessagesToBottom();
            }
          }
        }

        const preview = saved.body && saved.body.trim()
          ? saved.body
          : saved.attachment_name
            ? '📎 ' + saved.attachment_name
            : '';

        state.conversations = state.conversations.map((item) =>
          item.id === conversationId
            ? { ...item, last_message: preview, last_message_at: saved.created_at, last_sender: saved.sender_id }
            : item,
        );
        sortConversations();
        renderSidebar();
      }

      async function send(body) {
        const text = body.trim();
        const conversationId = state.activeId;
        if (!text || !conversationId) return;
        sendButton.disabled = true;
        composerError.textContent = '';

        try {
          const saved = await insert(conversationId, { body: text });
          textarea.value = '';
          textarea.style.height = 'auto';
          afterSend(saved, conversationId);
        } catch (error) {
          composerError.textContent = friendlyError(error, 'Could not send that message.');
        } finally {
          sendButton.disabled = false;
          textarea.focus();
        }
      }

      async function uploadFile(file) {
        const conversationId = state.activeId;
        if (!conversationId) return;
        composerError.textContent = '';

        if (file.size > MAX_FILE_BYTES) {
          composerError.textContent = `That file is ${formatBytes(file.size)} — the limit is 25 MB.`;
          return;
        }

        const caption = textarea.value.trim();
        const path = `${conversationId}/${newId()}-${safeFileName(file.name)}`;

        attachButton.disabled = true;
        sendButton.disabled = true;
        uploadBar.style.display = 'flex';
        uploadLabel.textContent = `Uploading ${file.name}`;
        uploadFill.style.width = '0%';

        try {
          const { error: uploadError } = await state.sb.storage
            .from('chat-files')
            .upload(path, file, {
              cacheControl: '3600',
              upsert: false,
              contentType: file.type || 'application/octet-stream',
              onUploadProgress: (event) => {
                if (event && event.total) {
                  uploadFill.style.width = `${Math.round((event.loaded / event.total) * 100)}%`;
                }
              },
            });
          if (uploadError) throw uploadError;

          uploadLabel.textContent = 'Sending…';
          const saved = await insert(conversationId, {
            body: caption,
            attachment_path: path,
            attachment_name: file.name,
            attachment_type: file.type || 'application/octet-stream',
            attachment_size: file.size,
          });

          textarea.value = '';
          textarea.style.height = 'auto';
          afterSend(saved, conversationId);
        } catch (error) {
          composerError.textContent = friendlyError(error, 'Could not upload that file.');
        } finally {
          attachButton.disabled = false;
          sendButton.disabled = false;
          uploadBar.style.display = 'none';
          uploadFill.style.width = '0%';
          textarea.focus();
        }
      }

      pane.append(
        h('header', { class: 'chat-header' },
          h('button', {
            class: 'ghost-button back-button',
            type: 'button',
            text: '←',
            onclick: () => {
              state.activeId = null;
              renderSidebar();
              renderChat();
            },
          }),
          h('div', { class: 'chat-header-text' },
            h('strong', { text: conversationTitle(conversation, state.me.id) }),
            h('span', { class: 'muted', text: conversationSubtitle(conversation, state.me.id) }),
          ),
          isGroupChat(conversation)
            ? h('div', { class: 'chat-header-actions' },
                h('button', {
                  class: 'ghost-button', type: 'button',
                  text: conversation.members.length === 1
                    ? '1 member'
                    : `${conversation.members.length} members`,
                  title: 'Group details',
                  onclick: openGroupDetails,
                }),
              )
            : h('div', { class: 'chat-header-actions' },
                h('button', {
                  class: 'ghost-button', type: 'button', text: '🎮 Duel',
                  title: 'Challenge to chess or Flappy Bird',
                  onclick: openDuelPicker,
                }),
              ),
        ),
        h('div', { class: 'messages', id: 'messages' }),
        ui.duelSlot = h('div', { class: 'duel-slot', id: 'duel-slot' }),
        h('div', { class: 'composer' },
          composerError,
          uploadBar,
          h('div', { class: 'composer-row' },
            fileInput,
            attachButton,
            textarea,
            sendButton,
          ),
          h('span', { class: 'composer-hint', text: 'Enter to send · Shift + Enter for a new line · 📎 sends a file' }),
        ),
      );

      renderMessages();
      textarea.focus();
