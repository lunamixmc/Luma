      loadDuel().then(renderDuel).catch(() => {});
    }

    async function selectConversation(conversationId) {
      state.activeId = conversationId;
      state.messages = [];
      state.duel = null;
      state.duelMoves = [];
      renderSidebar();
      renderChat();
      const messages = await loadMessages(conversationId);
      if (state.activeId !== conversationId) return; // user switched while loading
      state.messages = messages;
      renderMessages();
    }

    // ════════════════════════════════════════════════════════════════════
    //  8b. GROUP DETAILS — rename, add people, remove people, leave
    //  Everything except "leave" is creator-only; the database enforces the
    //  same rule, so a modified frontend cannot get around it.
    // ════════════════════════════════════════════════════════════════════
    function openGroupDetails() {
      const conversationId = state.activeId;
      if (!isGroupChat(activeConversation())) return;

      const current = () =>
        state.conversations.find((conversation) => conversation.id === conversationId) || null;

      const scroll = h('div', { class: 'modal-scroll' });
      const errorLine = h('p', { class: 'error', text: '' });
      let peopleRequested = false;

      const leaveButton = h('button', {
        class: 'mini-button danger', type: 'button', text: 'Leave group', onclick: () => leave(),
      });
      const closeButton = h('button', {
        class: 'mini-button', type: 'button', text: 'Close', onclick: () => close(),
      });

      const backdrop = h('div', { class: 'modal-backdrop' });
      const modal = h('div', { class: 'modal' },
        h('header', { class: 'modal-header' },
          h('h2', { text: 'Group details' }),
          h('button', {
            class: 'ghost-button', type: 'button', text: '✕',
            'aria-label': 'Close', onclick: () => close(),
          }),
        ),
        scroll,
        errorLine,
        h('div', { class: 'modal-footer' }, leaveButton, closeButton),
      );

      backdrop.append(modal);
      backdrop.addEventListener('click', (event) => {
        if (event.target === backdrop) close();
      });
      document.body.append(backdrop);
      document.addEventListener('keydown', onKey);

      function onKey(event) {
        if (event.key === 'Escape') close();
      }

      function close() {
        backdrop.remove();
        document.removeEventListener('keydown', onKey);
        if (ui.dialogRefresh === render) ui.dialogRefresh = null;
      }

      // Re-read the group and redraw the dialog (after any change).
      async function refresh() {
        await loadConversations();
        renderSidebar();
        if (!current()) {
          close();
          return;
        }
        render();
        if (state.activeId === conversationId) renderChat();
      }

      // ── actions ───────────────────────────────────────────────────────
      async function rename(conversation, nameInput, button) {
        const name = nameInput.value.trim();
        if (!name || name === conversation.name) return;
        button.disabled = true;
        button.textContent = 'Saving…';
        const { error } = await state.sb.rpc('rename_group', {
          p_conversation: conversationId,
          p_name: name,
        });
        if (error) {
          errorLine.textContent = friendlyError(error, 'Could not rename the group.');
          button.disabled = false;
          button.textContent = 'Rename';
          return;
        }
        errorLine.textContent = '';
        await refresh();
        toast('Group renamed.');
      }

      async function kick(person) {
        if (!window.confirm(`Remove @${person.username} from this group?`)) return;
        const { error } = await state.sb.rpc('remove_group_member', {
          p_conversation: conversationId,
          p_user: person.id,
        });
        if (error) {
          errorLine.textContent = friendlyError(error, 'Could not remove that person.');
          return;
        }
        errorLine.textContent = '';
        await refresh();
        toast(`@${person.username} was removed from the group.`);
      }

      async function add(person, button) {
        button.disabled = true;
        button.textContent = 'Adding…';
        const { error } = await state.sb.rpc('add_group_members', {
          p_conversation: conversationId,
          p_member_ids: [person.id],
        });
        if (error) {
          errorLine.textContent = friendlyError(error, 'Could not add that person.');
          button.disabled = false;
          button.textContent = 'Add';
          return;
        }
        errorLine.textContent = '';
        await refresh();
        toast(`@${person.username} joined the group.`);
      }

      async function leave() {
        const conversation = current();
        if (!conversation) return;
        const question = conversation.created_by === state.me.id
          ? `Leave "${conversation.name}"? Someone else will become the group creator.`
          : `Leave "${conversation.name}"? You will stop receiving its messages.`;
        if (!window.confirm(question)) return;

        const { error } = await state.sb.rpc('leave_group', { p_conversation: conversationId });
        if (error) {
          errorLine.textContent = friendlyError(error, 'Could not leave the group.');
          return;
        }

        close();
        state.activeId = null;
        state.messages = [];
        await loadConversations();
        renderSidebar();
        if (state.conversations.length) await selectConversation(state.conversations[0].id);
        else renderChat();
        toast('You left the group.');
      }

      // ── drawing ───────────────────────────────────────────────────────
      function render() {
        const conversation = current();
        if (!conversation) {
          close();
          return;
        }

        const creator = isCreatorOf(conversation);
        const nameInput = h('input', {
          maxlength: '60',
          value: conversation.name || '',
          disabled: !creator,
          'aria-label': 'Group name',
        });
        const nameRow = h('div', { class: 'group-name-row' }, nameInput);

        if (creator) {
          const renameButton = h('button', {
            class: 'mini-button accent', type: 'button', text: 'Rename', disabled: true,
          });
          const sync = () => {
            const value = nameInput.value.trim();
            renameButton.disabled = !value || value === conversation.name;
          };
          nameInput.addEventListener('input', sync);
          nameInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
              event.preventDefault();
              rename(conversation, nameInput, renameButton);
            }
          });
          renameButton.addEventListener('click', () => rename(conversation, nameInput, renameButton));
          nameRow.append(renameButton);
        }

        scroll.replaceChildren(
          h('div', { class: 'subsection-label', text: 'Name' }),
          nameRow,
          h('p', {
            class: 'group-hint',
            text: creator
              ? 'You created this group, so you can rename it, add people and remove them.'
              : !conversation.created_by
                ? 'The database is missing the latest schema, so no group has an owner yet. Re-run supabase/schema.sql.'
                : `Only @${usernameIn(conversation, conversation.created_by)} can manage this group.`,
          }),
        );

        // Members
        scroll.append(
          h('div', { class: 'subsection-label', text: `Members · ${conversation.members.length}` }),
        );
        const roster = h('div', { class: 'roster' });
        for (const person of conversation.members) {
          const row = h('div', { class: 'roster-row' },
            h('div', { class: 'avatar avatar-small', text: person.username.slice(0, 2).toUpperCase() }),
            h('div', { class: 'roster-name' },
              h('span', { text: '@' + person.username }),
              person.id === state.me.id ? h('em', { text: 'you' }) : null,
            ),
            person.id === conversation.created_by
              ? h('span', { class: 'roster-badge', text: 'creator' })
              : null,
          );
          if (creator && person.id !== state.me.id) {
            row.append(
              h('div', { class: 'roster-actions' },
                h('button', {
                  class: 'mini-button danger', type: 'button', text: 'Remove',
                  onclick: () => kick(person),
                }),
              ),
            );
          }
          roster.append(row);
        }
        scroll.append(roster);

        // Add people (creator only)
        if (!creator) return;

        const searchInput = h('input', {
          placeholder: 'Search usernames', autocomplete: 'off', spellcheck: 'false',
          'aria-label': 'Search usernames to add',
        });
        const results = h('div', { class: 'roster' });
        scroll.append(
          h('div', { class: 'subsection-label', text: 'Add people' }),
          searchInput,
          results,
        );

        const inGroup = new Set(conversation.members.map((member) => member.id));
        const candidates = state.people.filter((person) => !inGroup.has(person.id));

        function drawCandidates() {
          const query = searchInput.value.trim().toLowerCase();
          const matches = candidates.filter((person) => !query || person.username.includes(query));
          results.replaceChildren();

          if (candidates.length === 0) {
            results.append(h('p', { class: 'muted pad', text: 'Everyone who has signed up is already in this group.' }));
            return;
          }
          if (matches.length === 0) {
            results.append(h('p', { class: 'muted pad', text: 'No usernames match that search.' }));
            return;
          }
          for (const person of matches) {
            const addButton = h('button', { class: 'mini-button accent', type: 'button', text: 'Add' });
            addButton.addEventListener('click', () => add(person, addButton));
            results.append(
              h('div', { class: 'roster-row' },
                h('div', { class: 'avatar avatar-small', text: person.username.slice(0, 2).toUpperCase() }),
                h('div', { class: 'roster-name' }, h('span', { text: '@' + person.username })),
                h('div', { class: 'roster-actions' }, addButton),
              ),
            );
          }
        }

        searchInput.addEventListener('input', drawCandidates);
        drawCandidates();

        if (!peopleRequested) {
          peopleRequested = true;
          loadPeople().then((people) => {
            if (people.length > 0) render();
          }).catch((error) => {
            errorLine.textContent = friendlyError(error, 'Could not load the list of people.');
          });
        }
      }

      ui.dialogRefresh = render;
      render();
    }

    /** Username for somebody in this conversation, even if they have left. */
    function usernameIn(conversation, userId) {
      const member = conversation.members.find((person) => person.id === userId);
      return member ? member.username : 'someone';
    }

    // ════════════════════════════════════════════════════════════════════
    //  9. NEW CHAT DIALOG (direct message + group)
    // ════════════════════════════════════════════════════════════════════
    function openNewChatDialog() {
      let tab = 'dm';
      const selected = new Set();
      let search = '';

      const searchInput = h('input', { placeholder: 'Search usernames', autocomplete: 'off', spellcheck: 'false' });
      const listBox = h('div', { class: 'people-list' });
      const errorLine = h('p', { class: 'error', text: '' });
      const nameInput = h('input', { placeholder: 'e.g. Weekend plans', maxlength: '60' });
      const nameField = h('label', { class: 'modal-field', style: 'display:none' },
        h('span', { text: 'Group name' }), nameInput);
      const searchField = h('label', { class: 'modal-field' }, h('span', { text: 'Find someone' }), searchInput);

      const footerInfo = h('span', { class: 'muted' });
      const createButton = h('button', {
        class: 'primary-button', type: 'button', text: 'Create group', disabled: true,
        onclick: async () => {
          const name = nameInput.value.trim();
          if (!name) {
            errorLine.textContent = 'Give the group a name.';
            return;
          }
          createButton.disabled = true;
          createButton.textContent = 'Creating…';
          const { data, error } = await state.sb.rpc('create_group', {
            p_name: name,
            p_member_ids: Array.from(selected),
          });
          if (error) {
            errorLine.textContent = error.message;
            createButton.disabled = false;
            createButton.textContent = 'Create group';
            return;
          }
          close();
          await afterCreate(data);
        },
      });

      const footer = h('footer', { class: 'modal-footer', style: 'display:none' }, footerInfo, createButton);

      const dmTab = h('button', { class: 'tab active', type: 'button', text: 'Direct message' });
      const groupTab = h('button', { class: 'tab', type: 'button', text: 'Group chat' });

      const backdrop = h('div', { class: 'modal-backdrop' });
      const modal = h('div', { class: 'modal' },
        h('header', { class: 'modal-header' },
          h('h2', { text: 'New conversation' }),
          h('button', { class: 'ghost-button', type: 'button', text: '✕', 'aria-label': 'Close', onclick: () => close() }),
        ),
        h('div', { class: 'tabs' }, dmTab, groupTab),
        nameField,
        searchField,
        errorLine,
        listBox,
        footer,
      );

      backdrop.append(modal);
      backdrop.addEventListener('click', (event) => {
        if (event.target === backdrop) close();
      });
      document.body.append(backdrop);

      function close() {
        backdrop.remove();
        document.removeEventListener('keydown', onKey);
      }

      function onKey(event) {
        if (event.key === 'Escape') close();
      }
      document.addEventListener('keydown', onKey);

      function setTab(next) {
        tab = next;
        dmTab.classList.toggle('active', next === 'dm');
        groupTab.classList.toggle('active', next === 'group');
        nameField.style.display = next === 'group' ? 'flex' : 'none';
        footer.style.display = next === 'group' ? 'flex' : 'none';
        searchField.querySelector('span').textContent = next === 'dm' ? 'Find someone' : 'Add people';
        errorLine.textContent = '';
        renderPeople();
        (next === 'group' ? nameInput : searchInput).focus();
      }

      dmTab.addEventListener('click', () => setTab('dm'));
      groupTab.addEventListener('click', () => setTab('group'));
      searchInput.addEventListener('input', () => {
        search = searchInput.value.trim().toLowerCase();
        renderPeople();
      });
      nameInput.addEventListener('input', () => {
        createButton.disabled = !nameInput.value.trim();
      });

      function renderPeople() {
        const filtered = state.people.filter((person) =>
          !search || person.username.includes(search),
        );
        listBox.replaceChildren();

        if (state.people.length === 0) {
          listBox.append(
            h('p', { class: 'muted pad', text: 'Nobody else has signed up yet. Create a second account in a private window to test.' }),
          );
          return;
        }
        if (filtered.length === 0) {
          listBox.append(h('p', { class: 'muted pad', text: 'No usernames match that search.' }));
          return;
        }

        for (const person of filtered) {
          if (tab === 'dm') {
            listBox.append(
              h('button', {
                class: 'person', type: 'button',
                onclick: async () => {
                  const { data, error } = await state.sb.rpc('start_dm', { p_other: person.id });
                  if (error) {
                    errorLine.textContent = error.message;
                    return;
                  }
                  close();
                  await afterCreate(data);
                },
              },
                h('div', { class: 'avatar avatar-small', text: person.username.slice(0, 2).toUpperCase() }),
                h('span', { text: '@' + person.username }),
                h('span', { class: 'person-action', text: 'Message' }),
              ),
            );
          } else {
            const box = h('input', { type: 'checkbox' });
            box.checked = selected.has(person.id);
            box.addEventListener('change', () => {
              if (box.checked) selected.add(person.id);
              else selected.delete(person.id);
              updateFooter();
              renderPeople();
            });
            listBox.append(
              h('label', { class: 'person' + (box.checked ? ' selected' : '') },
                box,
                h('div', { class: 'avatar avatar-small', text: person.username.slice(0, 2).toUpperCase() }),
                h('span', { text: '@' + person.username }),
              ),
            );
          }
        }
      }

      function updateFooter() {
        footerInfo.textContent = selected.size === 0
          ? 'You can also create a group by yourself.'
          : `${selected.size} ${selected.size === 1 ? 'person' : 'people'} selected`;
      }

      async function afterCreate(conversationId) {
        await loadConversations();
        renderSidebar();
        await selectConversation(conversationId);
      }

      setTab('dm');
      updateFooter();

      // Load everyone else once (shared cache), then fill the list.
      loadPeople()
        .then(() => renderPeople())
        .catch((error) => {
          errorLine.textContent = friendlyError(error, 'Could not load the list of people.');
        });
    }

    // ════════════════════════════════════════════════════════════════════
    //  9b. DUELS — a chess or Flappy Bird match between the two people in a DM
    //  Moves are rows in duel_moves, appended through database functions. Both
    //  browsers replay the same rows, so the board always agrees.
    // ════════════════════════════════════════════════════════════════════

    let openDuelId = null;   // the duel whose game window is open
    let refreshOpenGame = null;

    const otherPlayerId = (duel) =>
      duel.challenger === state.me.id ? duel.opponent : duel.challenger;

    async function loadDuel() {
      const conversation = activeConversation();
      state.duel = null;
      state.duelMoves = [];
      if (!isDmChat(conversation)) return;

      const { data, error } = await state.sb
        .from('duels')
        .select('*')
        .eq('conversation_id', conversation.id)
        .order('created_at', { ascending: false })
        .limit(1);
      if (error || !data || data.length === 0) return;

      const duel = data[0];
      state.duel = duel;

      if (duel.status === 'active' || duel.status === 'finished') {
        const { data: rows } = await state.sb
          .from('duel_moves')
          .select('*')
          .eq('duel_id', duel.id)
          .order('id', { ascending: true });
        state.duelMoves = rows || [];
      }
    }

    /** Re-draw just the strip above the composer. */
    function renderDuel() {
      if (!ui.duelSlot) return;
      ui.duelSlot.replaceChildren();

      const duel = state.duel;
      const conversation = activeConversation();
      if (!duel || !conversation || conversation.id !== duel.conversation_id) return;
      if (state.duelDismissed.has(duel.id)) return;

      const mine = duel.challenger === state.me.id;
      const otherId = otherPlayerId(duel);
      const otherName = usernameOf(otherId);
      const gameName = duel.game === 'chess' ? 'Chess' : 'Flappy Bird';

      let title = '';
      let note = '';
      const actions = h('div', { class: 'duel-actions' });

      const button = (text, handler, variant) => {
        const node = h('button', {
          class: 'mini-button' + (variant ? ' ' + variant : ''),
          type: 'button', text,
        });
        node.addEventListener('click', handler);
        return node;
      };

      const act = async (call, okayMessage) => {
        try {
          const { error } = await call();
          if (error) throw error;
          if (okayMessage) toast(okayMessage);
        } catch (error) {
          toast(friendlyError(error, 'That did not work.'));
        }
        await loadDuel();
        renderDuel();
        if (refreshOpenGame && openDuelId === duel.id) refreshOpenGame();
      };

      if (duel.status === 'pending') {
        if (mine) {
          title = `You challenged @${otherName} to ${gameName}`;
          note = 'Waiting for them to accept…';
          actions.append(button('Cancel', (event) => {
            event.target.disabled = true;
            act(() => state.sb.rpc('cancel_duel', { p_duel: duel.id }));
          }));
        } else {
          title = `@${otherName} challenged you to ${gameName}`;
          note = 'Accept to start playing.';
          actions.append(
            button('Accept', (event) => {
              event.target.disabled = true;
              act(() => state.sb.rpc('answer_duel', { p_duel: duel.id, p_accept: true }), 'Game on.');
            }, 'accent'),
            button('Decline', (event) => {
              event.target.disabled = true;
              act(() => state.sb.rpc('answer_duel', { p_duel: duel.id, p_accept: false }));
            }),
          );
        }
      } else if (duel.status === 'active') {
        title = `${gameName} with @${otherName}`;
        if (duel.game === 'chess') {
          const played = state.duelMoves.filter((row) => row.kind === 'move').length;
          const turnColour = played % 2 === 0 ? 'w' : 'b';
          const myColour = mine ? 'w' : 'b';
          note = turnColour === myColour ? 'Your move.' : `Waiting for @${otherName}.`;
        } else {
          const scored = state.duelMoves.filter((row) => row.kind === 'score');
          const mineScored = scored.some((row) => row.player_id === state.me.id);
          note = mineScored ? `Score sent — waiting for @${otherName}.` : 'Play your round, then the scores decide it.';
        }
        actions.append(button(duel.game === 'chess' ? 'Open board' : 'Play', () => openGame(duel), 'accent'));
      } else {
        const winner = duel.winner;
        const iWon = winner === state.me.id;
        title = duel.status === 'declined'
          ? '@' + otherName + ' declined the game'
          : duel.status === 'cancelled'
            ? 'Duel cancelled'
            : winner === null && duel.status === 'finished'
              ? 'Draw'
              : iWon
                ? 'You won'
                : '@' + otherName + ' won';
        note = duel.status === 'finished'
          ? `${gameName}${duel.result ? ' · ' + duel.result : ''}`
          : gameName;
        actions.append(button('Dismiss', () => {
          state.duelDismissed.add(duel.id);
          renderDuel();
        }));
        if (duel.status === 'finished') {
          actions.append(button('Rematch', () => openDuelPicker(), 'accent'));
        }
      }

      ui.duelSlot.append(
        h('div', { class: 'duel-banner' + (duel.status === 'finished' || duel.status === 'declined' || duel.status === 'cancelled' ? ' finished' : '') },
          h('span', { class: 'duel-emoji', text: duel.game === 'chess' ? '♞' : '🐤' }),
          h('div', { class: 'duel-text' },
            h('strong', { text: title }),
            h('span', { text: note }),
          ),
          actions,
        ),
      );
    }

    function openDuelPicker() {
      const conversation = activeConversation();
      if (!isDmChat(conversation)) {
        toast('Duels only work in one-to-one chats.');
        return;
      }
      const opponent = conversation.members.find((person) => person.id !== state.me.id);
      if (!opponent) return;

      const errorLine = h('p', { class: 'admin-error' });
      const backdrop = h('div', { class: 'modal-backdrop' });
      const modal = h('div', { class: 'modal', style: 'width:min(420px,100%)' },
        h('header', { class: 'modal-header' },
          h('h2', { text: 'Challenge @' + opponent.username }),
          h('button', { class: 'ghost-button', type: 'button', text: '✕', 'aria-label': 'Close', onclick: () => close() }),
        ),
        h('p', { class: 'game-note', text: 'Pick a game. They get an invite in this chat.' }),
        h('div', { class: 'game-choices' },
          h('button', { class: 'game-choice', type: 'button', onclick: () => start('chess') },
            h('span', { class: 'duel-emoji', text: '♞' }),
            h('strong', { text: 'Chess' }),
            h('span', { class: 'muted', text: 'You play white if you invite.' }),
          ),
          h('button', { class: 'game-choice', type: 'button', onclick: () => start('flappy') },
            h('span', { class: 'duel-emoji', text: '🐤' }),
            h('strong', { text: 'Flappy Bird' }),
            h('span', { class: 'muted', text: 'Same pipes for both. Highest score wins.' }),
          ),
        ),
        errorLine,
      );

      backdrop.append(modal);
      backdrop.addEventListener('click', (event) => {
        if (event.target === backdrop) close();
      });
      document.body.append(backdrop);
      document.addEventListener('keydown', onKey);

      function close() {
        backdrop.remove();
        document.removeEventListener('keydown', onKey);
      }
      function onKey(event) {
        if (event.key === 'Escape') close();
      }

      async function start(game) {
        errorLine.textContent = '';
        const { error } = await state.sb.rpc('create_duel', {
          p_conversation: conversation.id,
          p_game: game,
          p_opponent: opponent.id,
        });
        if (error) {
          errorLine.textContent = friendlyError(error, 'Could not send that challenge.');
          return;
        }
        close();
        await loadDuel();
        renderDuel();
        toast('Challenge sent.');
      }
    }

    // ── A small, complete chess engine ─────────────────────────────────
    // Pure functions on a 64-square array (index 0 = a1). Moves are UCI text:
    // "e2e4", plus a piece letter for promotion ("e7e8q").
    const CHESS_FILE = 'abcdefgh';
    const CHESS_KNIGHT = [[1, 2], [2, 1], [2, -1], [1, -2], [-1, -2], [-2, -1], [-2, 1], [-1, 2]];
    const CHESS_DIAG = [[1, 1], [1, -1], [-1, 1], [-1, -1]];
    const CHESS_ORTH = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    const CHESS_ALL = CHESS_DIAG.concat(CHESS_ORTH);

    const chessFile = (i) => i % 8;
    const chessRank = (i) => Math.floor(i / 8);
    const chessOnBoard = (f, r) => f >= 0 && f < 8 && r >= 0 && r < 8;
    const chessSquareName = (i) => CHESS_FILE[i % 8] + (Math.floor(i / 8) + 1);
    const chessIndex = (name) =>
      CHESS_FILE.indexOf(name[0]) + (Number(name[1]) - 1) * 8;
    const oppositeColour = (colour) => (colour === 'w' ? 'b' : 'w');

    function chessNew() {
      const board = new Array(64).fill(null);
      const back = ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'];
      for (let f = 0; f < 8; f += 1) {
        board[f] = { t: back[f], c: 'w' };
        board[8 + f] = { t: 'p', c: 'w' };
        board[48 + f] = { t: 'p', c: 'b' };
        board[56 + f] = { t: back[f], c: 'b' };
      }
      return { board, turn: 'w', castle: { K: true, Q: true, k: true, q: true }, ep: null };
    }

    function chessAttacked(st, target, by) {
      const tf = chessFile(target);
      const tr = chessRank(target);

      // Pawns attack diagonally forward.
      const pawnRank = by === 'w' ? tr - 1 : tr + 1;
      for (const f of [tf - 1, tf + 1]) {
        if (!chessOnBoard(f, pawnRank)) continue;
        const piece = st.board[pawnRank * 8 + f];
        if (piece && piece.c === by && piece.t === 'p') return true;
      }
      for (const [df, dr] of CHESS_KNIGHT) {
        const f = tf + df, r = tr + dr;
        if (!chessOnBoard(f, r)) continue;
        const piece = st.board[r * 8 + f];
        if (piece && piece.c === by && piece.t === 'n') return true;
      }
      for (const [df, dr] of CHESS_ALL) {
        const f = tf + df, r = tr + dr;
        if (!chessOnBoard(f, r)) continue;
        const piece = st.board[r * 8 + f];
        if (piece && piece.c === by && piece.t === 'k') return true;
      }
      for (const [df, dr] of CHESS_DIAG) {
        let f = tf + df, r = tr + dr;
        while (chessOnBoard(f, r)) {
          const piece = st.board[r * 8 + f];
          if (piece) {
            if (piece.c === by && (piece.t === 'b' || piece.t === 'q')) return true;
            break;
          }
          f += df; r += dr;
        }
      }
      for (const [df, dr] of CHESS_ORTH) {
        let f = tf + df, r = tr + dr;
        while (chessOnBoard(f, r)) {
          const piece = st.board[r * 8 + f];
          if (piece) {
            if (piece.c === by && (piece.t === 'r' || piece.t === 'q')) return true;
            break;
          }
          f += df; r += dr;
        }
      }
      return false;
    }

    function chessKingSquare(st, colour) {
      for (let i = 0; i < 64; i += 1) {
        const piece = st.board[i];
        if (piece && piece.c === colour && piece.t === 'k') return i;
      }
      return -1;
    }

    function chessPseudoMoves(st, from) {
      const piece = st.board[from];
      if (!piece) return [];
      const out = [];
      const f0 = chessFile(from);
      const r0 = chessRank(from);

      if (piece.t === 'p') {
        const dir = piece.c === 'w' ? 1 : -1;
        const lastRank = piece.c === 'w' ? 7 : 0;
        const startRank = piece.c === 'w' ? 1 : 6;
        const one = from + 8 * dir;

        if (chessOnBoard(f0, r0 + dir) && !st.board[one]) {
          if (chessRank(one) === lastRank) {
            for (const promo of 'qrbn') out.push({ from, to: one, promo });
          } else {
            out.push({ from, to: one });
            const two = from + 16 * dir;
            if (r0 === startRank && !st.board[two]) out.push({ from, to: two });
          }
        }
        for (const df of [-1, 1]) {
          const f = f0 + df, r = r0 + dir;
          if (!chessOnBoard(f, r)) continue;
          const to = r * 8 + f;
          const target = st.board[to];
          if (target && target.c !== piece.c) {
            if (r === lastRank) {
              for (const promo of 'qrbn') out.push({ from, to, promo });
            } else {
              out.push({ from, to });
            }
          } else if (!target && st.ep === to) {
            out.push({ from, to });
          }
        }
        return out;
      }

      if (piece.t === 'n' || piece.t === 'k') {
        for (const [df, dr] of (piece.t === 'n' ? CHESS_KNIGHT : CHESS_ALL)) {
          const f = f0 + df, r = r0 + dr;
          if (!chessOnBoard(f, r)) continue;
          const to = r * 8 + f;
          const target = st.board[to];
          if (!target || target.c !== piece.c) out.push({ from, to });
        }
        if (piece.t === 'k') {
          const home = piece.c === 'w' ? 4 : 60;
          const enemy = oppositeColour(piece.c);
          if (from === home && !chessAttacked(st, home, enemy)) {
            const kingSide = piece.c === 'w' ? st.castle.K : st.castle.k;
            const queenSide = piece.c === 'w' ? st.castle.Q : st.castle.q;
            if (kingSide && !st.board[home + 1] && !st.board[home + 2]
                && !chessAttacked(st, home + 1, enemy)
                && !chessAttacked(st, home + 2, enemy)) {
              out.push({ from, to: home + 2 });
            }
            if (queenSide && !st.board[home - 1] && !st.board[home - 2] && !st.board[home - 3]
                && !chessAttacked(st, home - 1, enemy)
                && !chessAttacked(st, home - 2, enemy)) {
              out.push({ from, to: home - 2 });
            }
          }
        }
        return out;
      }

      const dirs = piece.t === 'b' ? CHESS_DIAG : piece.t === 'r' ? CHESS_ORTH : CHESS_ALL;
      for (const [df, dr] of dirs) {
        let f = f0 + df, r = r0 + dr;
        while (chessOnBoard(f, r)) {
          const to = r * 8 + f;
          const target = st.board[to];
          if (!target) {
            out.push({ from, to });
          } else {
            if (target.c !== piece.c) out.push({ from, to });
            break;
          }
          f += df; r += dr;
        }
      }
      return out;
    }

    function chessApply(st, move) {
      const board = st.board.map((piece) => (piece ? { t: piece.t, c: piece.c } : null));
      const piece = board[move.from];
      const next = { board, turn: oppositeColour(st.turn), castle: Object.assign({}, st.castle), ep: null };

      const f0 = chessFile(move.from), r0 = chessRank(move.from);
      const f1 = chessFile(move.to), r1 = chessRank(move.to);

      // En passant: the captured pawn is beside the moving pawn, not on `to`.
      if (piece.t === 'p' && st.ep === move.to && !board[move.to]) {
        board[move.to - 8 * (piece.c === 'w' ? 1 : -1)] = null;
      }

      board[move.to] = move.promo ? { t: move.promo, c: piece.c } : piece;
      board[move.from] = null;

      // Castling moves the rook too.
      if (piece.t === 'k' && Math.abs(f1 - f0) === 2) {
        if (f1 > f0) {
          board[move.to - 1] = board[move.to + 1];
          board[move.to + 1] = null;
        } else {
          board[move.to + 1] = board[move.to - 2];
          board[move.to - 2] = null;
        }
      }

      if (piece.t === 'p' && Math.abs(r1 - r0) === 2) {
        next.ep = (move.from + move.to) / 2;
      }

      if (piece.t === 'k') {
        if (piece.c === 'w') { next.castle.K = false; next.castle.Q = false; }
        else { next.castle.k = false; next.castle.q = false; }
      }
      // A rook that moves, or is captured on its corner, can no longer castle.
      for (const [square, right] of [[0, 'Q'], [7, 'K'], [56, 'q'], [63, 'k']]) {
        if (move.from === square || move.to === square) {
          next.castle[right] = false;
        }
      }

      return next;
    }

    const chessIsCheck = (st, colour) => {
      const king = chessKingSquare(st, colour);
      return king >= 0 && chessAttacked(st, king, oppositeColour(colour));
    };

    function chessLegalMoves(st) {
      const out = [];
      for (let i = 0; i < 64; i += 1) {
        const piece = st.board[i];
        if (!piece || piece.c !== st.turn) continue;
        for (const move of chessPseudoMoves(st, i)) {
          const next = chessApply(st, move);
          const king = chessKingSquare(next, st.turn);
          if (king < 0 || !chessAttacked(next, king, oppositeColour(st.turn))) {
            out.push(move);
          }
        }
      }
      return out;
    }

    function chessFromMoves(moves) {
      let st = chessNew();
      for (const text of moves) {
        const legal = chessLegalMoves(st);
        const move = legal.find((candidate) =>
          chessSquareName(candidate.from) + chessSquareName(candidate.to) + (candidate.promo || '') === text,
        );
        if (!move) break; // ignore anything that is not a legal move
        st = chessApply(st, move);
      }
      return st;
    }

    function chessStatus(st) {
      if (chessLegalMoves(st).length > 0) return 'playing';
      return chessIsCheck(st, st.turn) ? 'checkmate' : 'stalemate';
    }

    const CHESS_GLYPH = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };

    /** A modal with a game body and footer, wired to close cleanly. */
    function makeGameModal(title, onClose) {
      const body = h('div', { class: 'game-body' });
      const footer = h('div', { class: 'modal-footer' });
      const backdrop = h('div', { class: 'modal-backdrop' });
      const modal = h('div', { class: 'modal', style: 'width:min(540px,100%);max-height:min(92vh,780px)' },
        h('header', { class: 'modal-header' },
          h('h2', { text: title }),
          h('button', { class: 'ghost-button', type: 'button', text: '✕', 'aria-label': 'Close', onclick: () => close() }),
        ),
        body,
        footer,
      );

      backdrop.append(modal);
      backdrop.addEventListener('click', (event) => {
        if (event.target === backdrop) close();
      });
      document.body.append(backdrop);
      document.addEventListener('keydown', onKey);

      function close() {
        openDuelId = null;
        refreshOpenGame = null;
        document.removeEventListener('keydown', onKey);
        if (typeof onClose === 'function') onClose();
        backdrop.remove();
      }
      function onKey(event) {
        if (event.key === 'Escape') close();
      }

      footer.append(h('button', { class: 'mini-button', type: 'button', text: 'Close', onclick: () => close() }));
      return { body, footer, modal, close };
    }

    function openGame(duel) {
      if (duel.game === 'chess') openChess(duel);
      else openFlappy(duel);
    }

    /** The live row for this duel (kept fresh by realtime). */
    const currentDuel = (duel) => (state.duel && state.duel.id === duel.id ? state.duel : duel);

    // ── Chess board ───────────────────────────────────────────────────
    function openChess(duel) {
      openDuelId = duel.id;
      const myColour = duel.challenger === state.me.id ? 'w' : 'b';
      const otherName = usernameOf(otherPlayerId(duel));
      let selected = -1;

      const { body, footer, close } = makeGameModal('Chess');
      const hud = h('div', { class: 'game-hud' });
      const boardBox = h('div', { class: 'chess-board' });
      const promoBox = h('div', { class: 'promo-row' });
      const note = h('p', { class: 'game-note' });

      const resignButton = h('button', { class: 'mini-button danger', type: 'button', text: 'Resign' });
      resignButton.addEventListener('click', resign);
      footer.prepend(resignButton);
      body.append(hud, boardBox, promoBox, note);

      const rowsOfKind = (kind) => state.duelMoves.filter((row) => row.kind === kind);
      const moveTexts = () => rowsOfKind('move').map((row) => row.payload);

      function draw() {
        const live = currentDuel(duel);
        const st = chessFromMoves(moveTexts());
        const legal = chessLegalMoves(st);
        const moves = rowsOfKind('move');
        const lastRow = moves.length ? moves[moves.length - 1] : null;
        const lastText = lastRow ? lastRow.payload : '';
        const targets = selected >= 0 ? legal.filter((move) => move.from === selected) : [];
        const checkSquare = chessIsCheck(st, st.turn) ? chessKingSquare(st, st.turn) : -1;
        const running = live.status === 'active';
        const myTurn = running && st.turn === myColour;

        promoBox.replaceChildren();

        // Heading
        hud.replaceChildren();
        if (live.status === 'finished') {
          const iWon = live.winner === state.me.id;
          hud.append(h('span', { class: 'turn', text: live.winner === null ? 'Draw' : iWon ? 'You won' : '@' + otherName + ' won' }));
          hud.append(h('span', { text: live.result || '' }));
        } else if (live.status === 'active') {
          hud.append(h('span', { text: myColour === 'w' ? 'You are white' : 'You are black' }));
          hud.append(h('span', {
            class: 'turn' + (myTurn ? ' mine' : ''),
            text: myTurn ? 'Your move' : '@' + otherName + ' to move',
          }));
        } else {
          hud.append(h('span', { text: 'Waiting to start' }));
        }

        // Squares, from your side of the board
        boardBox.replaceChildren();
        const ranks = myColour === 'w' ? [7, 6, 5, 4, 3, 2, 1, 0] : [0, 1, 2, 3, 4, 5, 6, 7];
        const files = myColour === 'w' ? [0, 1, 2, 3, 4, 5, 6, 7] : [7, 6, 5, 4, 3, 2, 1, 0];

        for (const rank of ranks) {
          for (const file of files) {
            const index = rank * 8 + file;
            const piece = st.board[index];
            const name = chessSquareName(index);
            const classes = [
              'chess-square',
              (file + rank) % 2 === 1 ? 'light' : 'dark',
            ];
            if (lastText && (lastText.slice(0, 2) === name || lastText.slice(2, 4) === name)) classes.push('last');
            if (index === selected) classes.push('pick');
            if (index === checkSquare) classes.push('check');
            if (myTurn && piece && piece.c === myColour) classes.push('movable');

            const square = h('button', {
              class: classes.join(' '),
              type: 'button',
              'aria-label': name,
            });

            if (targets.some((move) => move.to === index)) {
              square.append(h('span', { class: piece ? 'ring' : 'dot' }));
            }
            if (piece) {
              square.append(h('span', {
                class: piece.c === 'w' ? 'piece-w' : 'piece-b',
                text: CHESS_GLYPH[piece.t],
              }));
            }

            // Only the player to move can pick a piece up.
            if (myTurn) {
              square.addEventListener('click', () => tap(index, st, legal));
            }
            boardBox.append(square);
          }
        }

        // Footer note
        if (live.status === 'finished') {
          note.textContent = live.result === 'resigned' ? 'The game ended by resignation.' : 'The board is final.';
        } else if (st.turn === myColour && chessIsCheck(st, myColour)) {
          note.textContent = 'You are in check — you must move out of it.';
        } else if (st.turn !== myColour && chessIsCheck(st, st.turn)) {
          note.textContent = '@' + otherName + ' is in check.';
        } else {
          note.textContent = myTurn ? 'Tap a piece, then a highlighted square.' : 'The board updates live.';
        }

        // Never let the waiting player move.
        resignButton.disabled = live.status !== 'active';
        checkForFinish(st, live, lastRow);
      }

      function tap(index, st, legal) {
        if (currentDuel(duel).status !== 'active' || st.turn !== myColour) return;
        if (selected === -1) {
          const piece = st.board[index];
          if (piece && piece.c === myColour) {
            selected = index;
            draw();
          }
          return;
        }
        if (selected === index) {
          selected = -1;
          draw();
          return;
        }

        const options = legal.filter((move) => move.from === selected && move.to === index);
        if (options.length === 0) {
          const piece = st.board[index];
          selected = piece && piece.c === myColour ? index : -1;
          draw();
          return;
        }
        if (options.length === 1) {
          play(options[0]);
          return;
        }

        // Promotion: let the player choose the piece.
        promoBox.replaceChildren();
        for (const choice of options) {
          promoBox.append(h('button', {
            type: 'button',
            text: CHESS_GLYPH[choice.promo],
            title: choice.promo,
            onclick: () => {
              promoBox.replaceChildren();
              play(choice);
            },
          }));
        }
      }

      async function play(move) {
        const uci = chessSquareName(move.from) + chessSquareName(move.to) + (move.promo || '');
        // Show the move immediately; the database row follows.
        state.duelMoves = state.duelMoves.concat([{
          id: 'local-' + Date.now(), kind: 'move', payload: uci, player_id: state.me.id,
        }]);
        selected = -1;
        draw();

        const { error } = await state.sb.rpc('chess_move', { p_duel: duel.id, p_move: uci });
        if (error) {
          toast(friendlyError(error, 'That move was refused.'));
        }
        await loadDuel();
        renderDuel();
        draw();
      }

      async function checkForFinish(st, live, lastRow) {
        if (live.status !== 'active') return;
        if (!lastRow || lastRow.player_id !== state.me.id) return;
        const outcome = chessStatus(st);
        if (outcome === 'playing') return;
        const winner = outcome === 'checkmate'
          ? (st.turn === 'w' ? live.opponent : live.challenger)
          : null;
        const { error } = await state.sb.rpc('chess_finish', {
          p_duel: live.id, p_winner: winner, p_result: outcome,
        });
        if (error) return;
        await loadDuel();
        renderDuel();
        draw();
      }

      async function resign() {
        if (!window.confirm('Resign this game? The other player wins.')) return;
        const { error } = await state.sb.rpc('resign_duel', { p_duel: duel.id });
        if (error) toast(friendlyError(error, 'Could not resign.'));
        await loadDuel();
        renderDuel();
        draw();
      }

      refreshOpenGame = draw;
      draw();
    }

    // ── Flappy Bird ───────────────────────────────────────────────────
    /** Deterministic RNG, so both players get the identical pipe layout. */
    function mulberry32(seed) {
      let a = seed >>> 0;
      return function random() {
        a = (a + 0x6D2B79F5) >>> 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function openFlappy(duel) {
      openDuelId = duel.id;
      const otherName = usernameOf(otherPlayerId(duel));

      const canvas = h('canvas', { class: 'flappy-canvas', width: '320', height: '420' });
      const ctx = canvas.getContext('2d');
      const hud = h('div', { class: 'game-hud' });
      const chips = h('div', { class: 'score-row' });
      const note = h('p', { class: 'game-note' });

      const { body, footer, close } = makeGameModal('Flappy Bird', stop);
      body.append(hud, canvas, chips, note);

      const forfeit = h('button', { class: 'mini-button danger', type: 'button', text: 'Forfeit' });
      forfeit.addEventListener('click', async () => {
        if (!window.confirm('Forfeit this round? The other player wins.')) return;
        const { error } = await state.sb.rpc('resign_duel', { p_duel: duel.id });
        if (error) toast(friendlyError(error, 'Could not forfeit.'));
        await loadDuel();
        renderDuel();
        sync();
      });
      footer.prepend(forfeit);

      const W = 320;
      const H = 420;
      const GRAVITY = 0.34;
      const FLAP = -5.9;
      const SPEED = 2.3;
      const GAP = 138;
      const PIPE_W = 54;
      const SPACING = 205;
      const BIRD_X = 74;
      const BIRD_R = 13;

      let bird = { y: H / 2, vy: 0 };
      let pipes = [];
      let score = 0;
      let alive = false;
      let running = false;
      let submitted = false;
      let random = null;
      let raf = 0;
      let lastTime = 0;

      const scoreOf = (playerId) => {
        const row = state.duelMoves.find((item) => item.kind === 'score' && item.player_id === playerId);
        return row ? Number(row.payload) : null;
      };
      const mine = () => scoreOf(state.me.id);
      const theirs = () => scoreOf(otherPlayerId(duel));

      function spawn() {
        const lastPipe = pipes[pipes.length - 1];
        pipes.push({
          x: lastPipe ? lastPipe.x + SPACING : W + 40,
          gapY: 70 + random() * (H - 250),
          counted: false,
        });
      }

      function begin() {
        random = mulberry32(duel.seed);
        bird = { y: H / 2, vy: 0 };
        pipes = [];
        score = 0;
        alive = true;
        running = true;
        lastTime = 0;
        spawn();
        drawFrame();
        sync();
        raf = requestAnimationFrame(tick);
      }

      function step() {
        bird.vy += GRAVITY;
        bird.y += bird.vy;

        for (const pipe of pipes) pipe.x -= SPEED;
        if (!pipes.length || pipes[pipes.length - 1].x < W - SPACING) spawn();
        while (pipes.length && pipes[0].x + PIPE_W < -20) pipes.shift();

        for (const pipe of pipes) {
          if (!pipe.counted && pipe.x + PIPE_W < BIRD_X - BIRD_R) {
            pipe.counted = true;
            score += 1;
          }
          const overlaps = BIRD_X + BIRD_R > pipe.x && BIRD_X - BIRD_R < pipe.x + PIPE_W;
          if (overlaps) {
            if (bird.y - BIRD_R < pipe.gapY || bird.y + BIRD_R > pipe.gapY + GAP) {
              die();
              return;
            }
          }
        }
        if (bird.y + BIRD_R > H || bird.y - BIRD_R < 0) die();
      }

      function die() {
        if (!alive) return;
        alive = false;
        running = false;
        drawFrame();
        submit();
      }

      async function submit() {
        if (submitted) return;
        submitted = true;
        const { error } = await state.sb.rpc('flappy_score', { p_duel: duel.id, p_score: score });
        if (error) toast(friendlyError(error, 'Could not send your score.'));
        await loadDuel();
        renderDuel();
        sync();
      }

      function flap() {
        if (alive) bird.vy = FLAP;
      }

      function tick(time) {
        if (!running) return;
        if (!lastTime) lastTime = time;
        const delta = Math.min((time - lastTime) / (1000 / 60), 4);
        lastTime = time;
        let steps = Math.max(1, Math.floor(delta));
        while (steps > 0 && alive) {
          step();
          steps -= 1;
        }
        drawFrame();
        if (alive) raf = requestAnimationFrame(tick);
      }

      function drawFrame() {
        ctx.clearRect(0, 0, W, H);
        const sky = ctx.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, '#0a1120');
        sky.addColorStop(1, '#141c2e');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = 'rgba(255,255,255,0.10)';
        for (let i = 0; i < 46; i += 1) {
          ctx.fillRect((i * 73) % W, (i * 151) % H, 1.5, 1.5);
        }

        for (const pipe of pipes) {
          const paint = ctx.createLinearGradient(pipe.x, 0, pipe.x + PIPE_W, 0);
          paint.addColorStop(0, '#b6a4ff');
          paint.addColorStop(1, '#7a67dd');
          ctx.fillStyle = paint;
          ctx.fillRect(pipe.x, 0, PIPE_W, pipe.gapY);
          ctx.fillRect(pipe.x, pipe.gapY + GAP, PIPE_W, H - pipe.gapY - GAP);
          ctx.fillStyle = 'rgba(10,13,20,0.35)';
          ctx.fillRect(pipe.x + PIPE_W - 8, 0, 8, pipe.gapY);
          ctx.fillRect(pipe.x + PIPE_W - 8, pipe.gapY + GAP, 8, H - pipe.gapY - GAP);
        }

        ctx.fillStyle = '#f6e27a';
        ctx.beginPath();
        ctx.arc(BIRD_X, bird.y, BIRD_R, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#0b0e14';
        ctx.beginPath();
        ctx.arc(BIRD_X + 5, bird.y - 4, 2.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ff9f43';
        ctx.beginPath();
        ctx.moveTo(BIRD_X + BIRD_R - 2, bird.y);
        ctx.lineTo(BIRD_X + BIRD_R + 9, bird.y + 4);
        ctx.lineTo(BIRD_X + BIRD_R - 2, bird.y + 8);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = 'rgba(240,240,245,0.9)';
        ctx.font = '700 30px Syne, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(String(score), W / 2, 52);

        if (!alive) {
          ctx.fillStyle = 'rgba(6,9,14,0.65)';
          ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = '#f0f0f5';
          ctx.font = '700 22px Syne, sans-serif';
          ctx.fillText('Game over', W / 2, H / 2 - 12);
          ctx.font = '400 13px "JetBrains Mono", monospace';
          ctx.fillStyle = 'rgba(240,240,245,0.7)';
          ctx.fillText(`score ${score}`, W / 2, H / 2 + 16);
        }
      }

      function sync() {
        const live = currentDuel(duel);
        const myScore = mine();
        const theirScore = theirs();

        hud.replaceChildren(
          h('span', { text: live.status === 'finished' ? 'Round over' : 'Same pipes for both' }),
          h('span', {
            class: 'turn',
            text: live.status === 'finished'
              ? (live.winner === null ? 'Draw' : live.winner === state.me.id ? 'You won' : '@' + otherName + ' won')
              : myScore === null ? 'Tap or press space' : 'Waiting…',
          }),
        );

        chips.replaceChildren(
          h('div', { class: 'score-chip me' },
            h('b', { text: myScore === null ? String(score) : String(myScore) }),
            h('span', { text: 'you' }),
          ),
          h('div', { class: 'score-chip' },
            h('b', { text: theirScore === null ? '—' : String(theirScore) }),
            h('span', { text: otherName }),
          ),
        );

        if (live.status === 'finished') {
          note.textContent = live.result === 'draw'
            ? 'Dead heat — nobody wins.'
            : live.winner === state.me.id
              ? 'You won this one.'
              : '@' + otherName + ' won this one.';
        } else if (myScore !== null && theirScore === null) {
          note.textContent = `Score sent. Waiting for @${otherName} to play.`;
        } else if (myScore !== null && theirScore !== null) {
          note.textContent = 'Both scores are in.';
        } else {
          note.textContent = 'Click the canvas or press space to flap. One run each — the higher score wins.';
        }

        if (live.status === 'active' && myScore === null && !running && !submitted) {
          begin();
        }
      }

      function onKeyDown(event) {
        if (event.key === ' ' || event.key === 'ArrowUp') {
          event.preventDefault();
          flap();
        }
      }
      function onPointerDown(event) {
        event.preventDefault();
        flap();
      }

      canvas.addEventListener('pointerdown', onPointerDown);
      document.addEventListener('keydown', onKeyDown);

      function stop() {
        running = false;
        if (raf) cancelAnimationFrame(raf);
        canvas.removeEventListener('pointerdown', onPointerDown);
        document.removeEventListener('keydown', onKeyDown);
      }

      refreshOpenGame = sync;
      drawFrame();
      sync();
    }

    // ════════════════════════════════════════════════════════════════════
    //  10. APP SHELL + REALTIME
    // ════════════════════════════════════════════════════════════════════
    function sortConversations() {
      state.conversations.sort((a, b) =>
        new Date(b.last_message_at || b.created_at).getTime() -
        new Date(a.last_message_at || a.created_at).getTime(),
      );
    }

    function buildShell() {
      ui.convList = h('div', { class: 'conversation-list' });
      ui.chatPane = h('section', { class: 'chat-pane' });

      const sidebar = h('aside', { class: 'sidebar' },
        h('header', { class: 'sidebar-header' },
          h('div', { class: 'me' },
            h('div', { class: 'avatar avatar-me', text: state.me.username.slice(0, 2).toUpperCase() }),
            h('div', { class: 'me-text' },
              h('strong', { text: '@' + state.me.username }),
              h('span', { class: 'muted', text: 'Signed in' }),
            ),
          ),
          h('button', {
            class: 'ghost-button', type: 'button', text: 'Sign out',
            onclick: () => state.sb.auth.signOut(),
          }),
        ),
        h('div', { class: 'sidebar-actions' },
          h('button', {
            class: 'primary-button small', type: 'button',
            onclick: openNewChatDialog,
          }, h('span', { class: 'plus', text: '+' }), 'New chat'),
        ),
        ui.convList,
      );

      ui.shell = h('div', { class: 'app-shell' }, sidebar, ui.chatPane);
      $root.replaceChildren(ui.shell);
    }

    function subscribeRealtime() {
      if (state.channel) {
        state.sb.removeChannel(state.channel);
        state.channel = null;
      }

      const channel = state.sb
        .channel('chat-stream')
        .on('postgres_changes',
          { event: 'INSERT', schema: 'public', table: 'messages' },
          (payload) => {
            const message = payload.new;

            if (!state.conversations.some((conversation) => conversation.id === message.conversation_id)) {
              loadConversations().then(renderSidebar);
              return;
            }

            if (message.conversation_id === state.activeId &&
                !state.messages.some((item) => item.id === message.id)) {
              const previous = state.messages[state.messages.length - 1] || null;
              state.messages.push(message);
              const box = document.getElementById('messages');
              if (box) {
                const emptyState = box.querySelector('.empty-chat');
                if (emptyState) emptyState.remove();
                box.append(buildMessageRow(message, previous));
                scrollMessagesToBottom();
              }
            }

            state.conversations = state.conversations.map((conversation) =>
              conversation.id === message.conversation_id
                ? { ...conversation, last_message: message.body, last_message_at: message.created_at, last_sender: message.sender_id }
                : conversation,
            );
            sortConversations();
            renderSidebar();
          })

        // Somebody edited a message.
        .on('postgres_changes',
          { event: 'UPDATE', schema: 'public', table: 'messages' },
          async (payload) => {
            const updated = payload.new;
            if (!updated) return;
            if (!state.conversations.some((conversation) => conversation.id === updated.conversation_id)) return;

            const stored = state.messages.find((item) => item.id === updated.id);
            if (stored && updated.conversation_id === state.activeId) {
              stored.body = updated.body;
              stored.edited_at = updated.edited_at;
              renderMessages({ keepScroll: true });
            }
            await loadConversations();
            renderSidebar();
          })

        // Somebody deleted a message.
        .on('postgres_changes',
          { event: 'DELETE', schema: 'public', table: 'messages' },
          async (payload) => {
            const gone = payload.old;
            if (!gone || !gone.id) return;
            if (gone.conversation_id &&
                !state.conversations.some((conversation) => conversation.id === gone.conversation_id)) return;

            const index = state.messages.findIndex((item) => item.id === gone.id);
            if (index > -1) {
              state.messages.splice(index, 1);
              renderMessages({ keepScroll: true });
            }
            await loadConversations();
            renderSidebar();
            if (ui.dialogRefresh) ui.dialogRefresh();
          })

        // Membership changes: somebody added me, or somebody else to my group,
        // or I was removed.
        .on('postgres_changes',
          { event: '*', schema: 'public', table: 'conversation_members' },
          async () => {
            // Remember what was open before the reload: loadConversations() will
            // silently select a different chat if this one is gone, so comparing
            // afterwards would always look fine.
            const wasOpen = state.activeId;
            await loadConversations();

            if (wasOpen && !state.conversations.some((item) => item.id === wasOpen)) {
              // Kicked (or the group was deleted): drop the stale pane at once.
              state.messages = [];
              if (state.activeId) await selectConversation(state.activeId);
              else renderChat();
              toast('You are no longer in that chat.');
            } else {
              renderSidebar();
            }

            if (ui.dialogRefresh) ui.dialogRefresh();
          })

        // A group was renamed, or its creator changed.
        .on('postgres_changes',
          { event: 'UPDATE', schema: 'public', table: 'conversations' },
          async (payload) => {
            await loadConversations();
            renderSidebar();
            if (payload.new && payload.new.id === state.activeId) renderChat();
            if (ui.dialogRefresh) ui.dialogRefresh();
          })

        // A duel was created, accepted, resigned or finished.
        .on('postgres_changes',
          { event: '*', schema: 'public', table: 'duels' },
          async (payload) => {
            const row = payload.new || payload.old;
            if (!row || row.conversation_id !== state.activeId) return;
            await loadDuel();
            renderDuel();
            if (refreshOpenGame && openDuelId === row.id) refreshOpenGame();
          })

        // A chess move or a Flappy Bird score arrived.
        .on('postgres_changes',
          { event: 'INSERT', schema: 'public', table: 'duel_moves' },
          async (payload) => {
            const row = payload.new;
            if (!row || !state.duel || row.duel_id !== state.duel.id) return;
            await loadDuel();
            renderDuel();
            if (refreshOpenGame && openDuelId === row.duel_id) refreshOpenGame();
          })

        .subscribe();

      state.channel = channel;
    }

    async function enterApp() {
      state.me = await loadProfile();
      if (!state.me) {
        renderAuth('Your account exists but has no profile row. Run supabase/schema.sql again.');
        return;
      }
      if (state.me.suspended) {
        renderSuspended();
        return;
      }

      await loadConversations();
      buildShell();
      renderSidebar();
      renderChat();
      if (state.activeId) await selectConversation(state.activeId);
      subscribeRealtime();
    }

    function leaveApp() {
      if (state.channel && state.sb) {
        state.sb.removeChannel(state.channel);
        state.channel = null;
      }
      state.session = null;
      state.me = null;
      state.conversations = [];
      state.messages = [];
      state.activeId = null;
      state.people = [];
      authMode = 'signin';
      ui.shell = null;
      ui.convList = null;
      ui.chatPane = null;
      ui.dialogRefresh = null;
    }

    // ════════════════════════════════════════════════════════════════════
    //  10c. OWNER CONSOLE
    //  Opened by typing the secret knock anywhere. The password itself is never
    //  in this file: the database holds a hash and checks what you type.
    // ════════════════════════════════════════════════════════════════════

    const ADMIN_KNOCK = '1233211233216767';

    const adminDate = (iso) => (iso ? new Date(iso).toLocaleString() : '—');

    function schemaHint(error) {
      const text = String((error && error.message) || '');
      if (/could not find the function|schema cache|does not exist/i.test(text)) {
        return 'The database is missing the newest schema. Paste supabase/schema.sql into the Supabase SQL editor and run it.';
      }
      return friendlyError(error, 'That did not work.');
    }

    async function adminCall(name, args) {
      const { data, error } = await state.sb.rpc(
        name,
        Object.assign({ p_key: state.admin.key }, args || {}),
      );
      if (error) throw error;
      return data;
    }

    function renderSuspended() {
      $root.replaceChildren(
        h('div', { class: 'auth' },
          h('div', { class: 'auth-card' },
            h('div', { class: 'brand' },
              h('div', { class: 'brand-mark', text: '⛔' }),
              h('div', null,
                h('h1', { text: 'Account suspended' }),
                h('p', { class: 'muted', text: 'An owner has paused this account.' })),
            ),
            h('p', { class: 'note' },
              'You can still sign in, but you cannot send messages or start new chats until ',
              'the account is restored. If you think this is a mistake, contact whoever runs this chat.'),
            h('button', {
              class: 'primary-button', type: 'button', text: 'Sign out',
              onclick: () => state.sb.auth.signOut(),
            }),
          ),
        ),
      );
    }

    function openAdminGate() {
      if (!state.session) {
        toast('Sign in first, then type the code again.');
        return;
      }
      if (document.querySelector('.admin-screen')) return; // already open
      if (state.admin.key) {
        openAdminPanel();
        return;
      }

      const input = h('input', { type: 'password', placeholder: 'Owner password', autocomplete: 'current-password' });
      const line = h('p', { class: 'admin-error' });
      const unlock = h('button', { class: 'mini-button accent', type: 'submit', text: 'Unlock' });

      const form = h('form', { style: 'display:flex;flex-direction:column;gap:0.6rem' },
        h('label', { class: 'modal-field' }, h('span', { text: 'Password' }), input),
        line,
        h('div', { class: 'modal-footer' },
          h('button', { class: 'mini-button', type: 'button', text: 'Cancel', onclick: () => close() }),
          unlock,
        ),
      );

      const backdrop = h('div', { class: 'modal-backdrop' });
      const modal = h('div', { class: 'modal', style: 'width:min(400px,100%)' },
        h('header', { class: 'modal-header' },
          h('h2', { text: 'Owner console' }),
          h('button', { class: 'ghost-button', type: 'button', text: '✕', 'aria-label': 'Close', onclick: () => close() }),
        ),
        h('p', { class: 'game-note', text: 'Only the owner password opens this. Every change is written to the database.' }),
        form,
      );

      backdrop.append(modal);
      backdrop.addEventListener('click', (event) => {
        if (event.target === backdrop) close();
      });
      document.body.append(backdrop);
      document.addEventListener('keydown', onKey);
      input.focus();

      function close() {
        backdrop.remove();
        document.removeEventListener('keydown', onKey);
      }
      function onKey(event) {
        if (event.key === 'Escape') close();
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        line.textContent = '';
        unlock.disabled = true;
        unlock.textContent = 'Checking…';
        try {
          const { data, error } = await state.sb.rpc('admin_login', { p_key: input.value });
          if (error) throw error;
          if (!data) {
            line.textContent = 'Wrong password.';
            input.select();
            return;
          }
          state.admin.key = input.value;
          close();
          openAdminPanel();
        } catch (error) {
          line.textContent = schemaHint(error);
        } finally {
          unlock.disabled = false;
          unlock.textContent = 'Unlock';
        }
      });
    }

    function openAdminPanel() {
      const body = h('div', { class: 'admin-body' });
      const tabRow = h('div', { class: 'admin-tabs' });
      const tabNodes = {};
      let current = 'overview';

      for (const [id, label] of [['overview', 'Overview'], ['people', 'People'], ['chats', 'Chats'], ['messages', 'Messages']]) {
        const node = h('button', { class: 'admin-tab', type: 'button', text: label });
        node.addEventListener('click', () => show(id));
        tabNodes[id] = node;
        tabRow.append(node);
      }

      const screen = h('div', { class: 'admin-screen' },
        h('header', { class: 'admin-top' },
          h('div', { class: 'admin-title' },
            h('span', { text: 'Owner console' }),
            h('span', { class: 'admin-tag', text: '@' + ((state.me && state.me.username) || 'owner') }),
          ),
          tabRow,
          h('button', { class: 'ghost-button', type: 'button', text: 'Back to chat', onclick: () => close() }),
        ),
        body,
      );

      document.body.append(screen);
      document.addEventListener('keydown', onKey);

      function close() {
        screen.remove();
        document.removeEventListener('keydown', onKey);
        // The console can change anything: re-read the chat behind it.
        loadConversations()
          .then(() => {
            renderSidebar();
            if (state.activeId) return selectConversation(state.activeId);
            renderChat();
            return null;
          })
          .catch(() => {});
      }
      function onKey(event) {
        if (event.key === 'Escape') close();
      }

      const panel = (...nodes) => body.replaceChildren(h('div', { class: 'admin-panel' }, ...nodes));
      const statCard = (label, value) =>
        h('div', { class: 'admin-stat' }, h('b', { text: String(value) }), h('span', { text: label }));

      async function run(name, args, message) {
        try {
          await adminCall(name, args);
          if (message) toast(message);
          await show(current);
        } catch (error) {
          toast(schemaHint(error));
        }
      }

      function messageTable(rows) {
        if (!rows || rows.length === 0) {
          return h('p', { class: 'admin-empty', text: 'Nothing here yet.' });
        }
        const bodyRows = h('tbody');
        for (const row of rows) {
          const remove = h('button', { class: 'mini-button danger', type: 'button', text: 'Delete' });
          remove.addEventListener('click', async () => {
            if (!window.confirm('Delete this message for everyone?')) return;
            await run('admin_delete_message', { p_message: row.id }, 'Message deleted.');
          });
          const text = (row.body || '').slice(0, 150);
          bodyRows.append(
            h('tr', null,
              h('td', { text: adminDate(row.created_at) }),
              h('td', { class: 'name', text: '@' + row.sender }),
              h('td', { text: row.chat_label || '' }),
              h('td', { class: 'body', title: row.body || '' },
                text,
                row.attachment ? h('span', { class: 'muted', text: ' 📎 ' + row.attachment }) : null,
              ),
              h('td', null, h('div', { class: 'admin-actions' }, remove)),
            ),
          );
        }
        return h('table', { class: 'admin-table' },
          h('thead', null, h('tr', null,
            ['When', 'Who', 'Where', 'Message', ''].map((label) => h('th', { text: label })),
          )),
          bodyRows,
        );
      }

      async function drawOverview() {
        const [stats, recent] = await Promise.all([
          adminCall('admin_overview'),
          adminCall('admin_messages', { p_limit: 15 }),
        ]);
        panel(
          h('div', { class: 'admin-stats' },
            statCard('Accounts', stats.people),
            statCard('Chats', stats.chats),
            statCard('Groups', stats.groups),
            statCard('Messages', stats.messages),
            statCard('Files', stats.files),
            statCard('File size', formatBytes(stats.bytes)),
            statCard('Duels', stats.duels),
            statCard('Suspended', stats.suspended),
          ),
          h('div', { class: 'admin-card' },
            h('h3', { text: 'Timeline' }),
            h('p', { class: 'admin-note', text: 'First account: ' + adminDate(stats.first_signup) }),
            h('p', { class: 'admin-note', text: 'Latest message: ' + adminDate(stats.last_message) }),
          ),
          h('div', { class: 'admin-card' },
            h('h3', { text: 'Latest activity' }),
            messageTable(recent),
          ),
        );
      }

      async function drawPeople() {
        const people = await adminCall('admin_people');
        const search = h('input', { placeholder: 'Search usernames', autocomplete: 'off' });
        const rowsBox = h('tbody');

        const drawRows = () => {
          const query = search.value.trim().toLowerCase();
          const list = people.filter((person) => !query || person.username.includes(query));
          rowsBox.replaceChildren();

          if (list.length === 0) {
            rowsBox.append(h('tr', null, h('td', { colspan: '7' },
              h('span', { class: 'admin-empty', text: 'No accounts match that search.' }))));
            return;
          }

          for (const person of list) {
            const actions = h('div', { class: 'admin-actions' });

            const rename = h('button', { class: 'mini-button', type: 'button', text: 'Rename' });
            rename.addEventListener('click', async () => {
              const next = window.prompt(`New username for @${person.username}`, person.username);
              if (next === null) return;
              await run('admin_rename_user', { p_user: person.id, p_name: next }, 'Username changed.');
            });

            const password = h('button', { class: 'mini-button', type: 'button', text: 'Password' });
            password.addEventListener('click', async () => {
              const next = window.prompt(`New password for @${person.username} (at least 6 characters)`);
              if (!next) return;
              await run('admin_set_user_password', { p_user: person.id, p_password: next }, 'Password changed.');
            });

            const suspend = h('button', {
              class: 'mini-button' + (person.suspended ? '' : ' danger'),
              type: 'button',
              text: person.suspended ? 'Restore' : 'Suspend',
            });
            suspend.addEventListener('click', async () => {
              const next = !person.suspended;
              const question = next
                ? `Suspend @${person.username}? They will not be able to post until restored.`
                : `Restore @${person.username}?`;
              if (!window.confirm(question)) return;
              await run('admin_suspend_user', { p_user: person.id, p_suspended: next },
                next ? 'Account suspended.' : 'Account restored.');
            });

            const remove = h('button', { class: 'mini-button danger', type: 'button', text: 'Delete' });
            remove.addEventListener('click', async () => {
              const typed = window.prompt(`Type ${person.username} to delete this account for good.`);
              if (typed === null) return;
              if (typed.trim().toLowerCase() !== person.username) {
                toast('That name did not match — nothing was deleted.');
                return;
              }
              await run('admin_delete_user', { p_user: person.id }, 'Account deleted.');
            });

            actions.append(rename, password, suspend, remove);

            rowsBox.append(
              h('tr', null,
                h('td', { text: adminDate(person.created_at) }),
                h('td', { class: 'name', text: '@' + person.username }),
                h('td', null, person.suspended ? h('span', { class: 'badge-suspended', text: 'suspended' }) : null),
                h('td', { text: String(person.msg_count) }),
                h('td', { text: String(person.chat_count) }),
                h('td', { text: person.last_active ? adminDate(person.last_active) : 'never' }),
                h('td', null, actions),
              ),
            );
          }
        };

        search.addEventListener('input', drawRows);
        drawRows();

        panel(
          h('div', { class: 'admin-card' },
            h('h3', { text: `People · ${people.length}` }),
            h('div', { class: 'admin-search' }, search),
            h('table', { class: 'admin-table' },
              h('thead', null, h('tr', null,
                ['Joined', 'Username', '', 'Messages', 'Chats', 'Last seen', 'Actions']
                  .map((label) => h('th', { text: label })),
              )),
              rowsBox,
            ),
          ),
        );
      }

      async function drawChats() {
        const chats = await adminCall('admin_chats');
        const search = h('input', { placeholder: 'Search names or usernames', autocomplete: 'off' });
        const rowsBox = h('tbody');

        const drawRows = () => {
          const query = search.value.trim().toLowerCase();
          const list = chats.filter((chat) =>
            !query
            || (chat.name || '').toLowerCase().includes(query)
            || String(chat.creator || '').toLowerCase().includes(query));
          rowsBox.replaceChildren();

          if (list.length === 0) {
            rowsBox.append(h('tr', null, h('td', { colspan: '7' },
              h('span', { class: 'admin-empty', text: 'No chats match that search.' }))));
            return;
          }

          for (const chat of list) {
            const remove = h('button', { class: 'mini-button danger', type: 'button', text: 'Delete' });
            remove.addEventListener('click', async () => {
              const label = chat.kind === 'group' ? chat.name : 'this DM';
              if (!window.confirm(`Delete ${label} and all of its messages? This cannot be undone.`)) return;
              await run('admin_delete_chat', { p_conversation: chat.id }, 'Chat deleted.');
            });

            rowsBox.append(
              h('tr', null,
                h('td', null, h('span', { class: 'admin-tag', text: chat.kind })),
                h('td', { class: 'name', text: chat.kind === 'group' ? (chat.name || 'Group') : 'Direct message' }),
                h('td', { text: chat.creator ? '@' + chat.creator : '—' }),
                h('td', { text: String(chat.member_count) }),
                h('td', { text: String(chat.msg_count) }),
                h('td', { text: adminDate(chat.last_active || chat.created_at) }),
                h('td', null, h('div', { class: 'admin-actions' }, remove)),
              ),
            );
          }
        };

        search.addEventListener('input', drawRows);
        drawRows();

        panel(
          h('div', { class: 'admin-card' },
            h('h3', { text: `Chats · ${chats.length}` }),
            h('div', { class: 'admin-search' }, search),
            h('table', { class: 'admin-table' },
              h('thead', null, h('tr', null,
                ['Type', 'Name', 'Creator', 'Members', 'Messages', 'Last active', 'Actions']
                  .map((label) => h('th', { text: label })),
              )),
              rowsBox,
            ),
          ),
        );
      }

      async function drawMessages() {
        const search = h('input', { placeholder: 'Search messages, filenames or usernames', autocomplete: 'off' });
        const holder = h('div', { class: 'admin-loading', text: 'Loading…' });
        let timer = null;

        const load = async () => {
          holder.replaceChildren(h('p', { class: 'admin-loading', text: 'Searching…' }));
          try {
            const rows = await adminCall('admin_messages', {
              p_search: search.value.trim() || null,
              p_limit: 300,
            });
            holder.replaceChildren(messageTable(rows));
          } catch (error) {
            holder.replaceChildren(h('p', { class: 'admin-empty', text: schemaHint(error) }));
          }
        };

        search.addEventListener('input', () => {
          window.clearTimeout(timer);
          timer = window.setTimeout(load, 250);
        });

        panel(
          h('div', { class: 'admin-card' },
            h('h3', { text: 'Every message' }),
            h('div', { class: 'admin-search' }, search),
            holder,
          ),
        );
        await load();
      }

      async function show(tab) {
        current = tab;
        state.admin.tab = tab;
        Object.entries(tabNodes).forEach(([id, node]) => node.classList.toggle('active', id === tab));
